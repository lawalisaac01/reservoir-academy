id:"m9", num:"09", title:"Water Influx", depth:"2,750 – 2,950 m",
tag:"Dynamics",
blurb:"Modelling the aquifer: Schilthuis and Hurst steady-state models, van Everdingen–Hurst unsteady state, and Fetkovich's pseudo-steady shortcut.",
lessons:[
{title:"Aquifer models I: steady state", type:"read", html:`
<h3>The invisible partner</h3>
<p>Most reservoirs are small blisters on vast aquifers. As reservoir pressure falls, the aquifer water expands and intrudes: <span class="keyterm">water influx W<sub>e</sub></span>. We never see the aquifer directly — we choose a mathematical model and fit its parameters until the material balance behaves.</p>
<h3>Schilthuis steady state (1936)</h3>
<p>Assumes the aquifer is so large and permeable that influx is proportional to the instantaneous pressure drop:</p>
<div class="fx"><span class="frac"><span>dW<sub>e</sub></span><span>dt</span></span> = k′(p<sub>i</sub> − p) &nbsp;⇒&nbsp; W<sub>e</sub> = k′∫(p<sub>i</sub> − p)dt</div>
<p>k′ = influx constant (bbl/d/psi), found by history matching. Valid for strong, highly conductive aquifers (or outcropping/recharged ones); otherwise it over-predicts late influx because real aquifers deplete.</p>
<h3>Hurst modified steady state</h3>
<p>Hurst let the effective aquifer resistance grow with time as the pressure disturbance travels outward:</p>
<div class="fx"><span class="frac"><span>dW<sub>e</sub></span><span>dt</span></span> = <span class="frac"><span>c′(p<sub>i</sub> − p)</span><span>log(a t)</span></span></div>
<p>Two fit constants (c′, a) give it more flexibility, but it is fundamentally a patch. The honest treatment of time-dependence is van Everdingen–Hurst.</p>
`},
{title:"Aquifer models II: van Everdingen–Hurst & Fetkovich", type:"read", html:`
<h3>van Everdingen–Hurst (unsteady state, 1949)</h3>
<p>Solve the radial diffusivity equation for the aquifer with a constant-pressure inner boundary. Results come as a dimensionless influx function W<sub>eD</sub>(t<sub>D</sub>, r<sub>eD</sub>) — tabulated/charted — where:</p>
<div class="fx">t<sub>D</sub> = <span class="frac"><span>6.328×10<sup>−3</sup> k t</span><span>φ μ<sub>w</sub> c<sub>t</sub> r<sub>o</sub>²</span></span> &nbsp;(t in days),&nbsp;&nbsp; r<sub>eD</sub> = r<sub>aquifer</sub>/r<sub>o</sub></div>
<div class="fx"><span class="lbl">Influx for one pressure step Δp</span>W<sub>e</sub> = U · Δp · W<sub>eD</sub>(t<sub>D</sub>),&nbsp;&nbsp; U = 1.119 φ c<sub>t</sub> r<sub>o</sub>² h f &nbsp;(bbl/psi)</div>
<div class="vars"><b>U</b> aquifer constant · <b>r<sub>o</sub></b> reservoir radius · <b>f</b> = encroachment angle/360° for partial peripheries.</div>
<p>Real pressure histories are handled by <span class="keyterm">superposition</span>: decompose the boundary pressure into a staircase of steps Δp<sub>j</sub> (each Δp<sub>j</sub> = (p<sub>j−1</sub> − p<sub>j+1</sub>)/2 convention), and sum:</p>
<div class="fx">W<sub>e</sub>(t<sub>n</sub>) = U Σ<sub>j</sub> Δp<sub>j</sub> · W<sub>eD</sub>(t<sub>Dn</sub> − t<sub>Dj</sub>)</div>
<h3>Fetkovich (1971) — the engineer's shortcut</h3>
<p>Treat the finite aquifer like a well on pseudo-steady-state decline: it has a starting inventory and a productivity index J:</p>
<div class="fx">W<sub>ei</sub> = c<sub>t</sub> W<sub>i</sub> p<sub>i</sub> &nbsp;(maximum encroachable water)<br>
ΔW<sub>e,n</sub> = <span class="frac"><span>W<sub>ei</sub></span><span>p<sub>i</sub></span></span>( p̄<sub>a,n−1</sub> − p̄<sub>R,n</sub> )( 1 − e<sup>−J p<sub>i</sub> Δt / W<sub>ei</sub></sup> )</div>
<p>where the average aquifer pressure is updated each step: p̄<sub>a</sub> = p<sub>i</sub>(1 − W<sub>e</sub>/W<sub>ei</sub>). No superposition, no tables — which is why simulators and spreadsheets love it. <b>Carter–Tracy</b> is a related step-wise approximation of vEH that also avoids full superposition.</p>
<div class="callout"><div class="ct">Fitting strategy</div><p>Aquifer parameters are never known a priori. Assume a model → compute W<sub>e</sub>(t) → insert into F/E<sub>t</sub> = N + W<sub>e</sub>/E<sub>t</sub> → demand a straight line of slope 1. Curved? Adjust aquifer size/strength and repeat. Aquifer fitting is disciplined trial-and-error, and non-uniqueness is real: several aquifer/N pairs may fit — keep monitoring and updating.</p></div>
`},
{title:"Checkpoint · Module 9", type:"quiz", quiz:[
{q:"The Schilthuis model assumes influx rate proportional to…",opts:["Time","(pi − p), the total pressure drop","Gp","Aquifer radius"],a:1,why:"Steady state: dWe/dt = k′(pi − p) — appropriate only for very strong aquifers."},
{q:"van Everdingen–Hurst solves…",opts:["Darcy's law in linear form","The radial diffusivity equation with constant inner pressure","Bernoulli's equation","The material balance directly"],a:1,why:"It is the rigorous unsteady-state solution, delivered as dimensionless WeD(tD, reD) tables."},
{q:"Superposition is needed in vEH because…",opts:["The aquifer is infinite","Boundary pressure changes continuously, not in one step","z varies","Water is compressible"],a:1,why:"The linear diffusivity equation lets us sum the responses of many small pressure steps."},
{q:"In Fetkovich's model, Wei = ct·Wi·pi represents…",opts:["Aquifer productivity index","Maximum water the aquifer can ever deliver","Initial influx rate","Encroachment angle"],a:1,why:"Expanding the total aquifer water by full depressurisation gives the encroachable maximum."},
{q:"An aquifer model is judged adequate when…",opts:["WeD tables are interpolated smoothly","F/Et vs We/Et forms a straight line (slope 1, intercept N)","p/z is curved","It predicts We = 0"],a:1,why:"The Havlena–Odeh diagnostic: only the correct influx history linearises the material balance."}
]}
]});

COURSE.push({
id:"m10", num:"10", title:"Fluid Flow in Porous Media", depth:"2,950 – 3,150 m",
tag:"Dynamics",
blurb:"The diffusivity equation, the three flow regimes, radial flow solutions, skin, and superposition — the physics under every well test.",
lessons:[
{title:"The diffusivity equation & flow regimes", type:"read", html:`
<h3>Three laws, one equation</h3>
<p>Combine (1) conservation of mass, (2) Darcy's law, and (3) an equation of state for a slightly compressible fluid, and radial flow obeys the <span class="keyterm">diffusivity equation</span>:</p>
<div class="fx"><span class="frac"><span>∂²p</span><span>∂r²</span></span> + <span class="frac"><span>1</span><span>r</span></span><span class="frac"><span>∂p</span><span>∂r</span></span> = <span class="frac"><span>φ μ c<sub>t</sub></span><span>0.0002637 k</span></span> · <span class="frac"><span>∂p</span><span>∂t</span></span> &nbsp;&nbsp;(field units, t in hours)</div>
<p>The group η = 0.0002637k/(φμc<sub>t</sub>) is the <span class="keyterm">hydraulic diffusivity</span> — how fast pressure disturbances travel. Pressure diffuses like heat: it does not “arrive” at a boundary, it fades in.</p>
<h3>The three regimes every test passes through</h3>
<ul>
<li><b>Transient (infinite-acting):</b> the pressure wave hasn't yet felt any boundary. ∂p/∂t depends on position. All classic well-test analysis lives here.</li>
<li><b>Pseudo-steady state (PSS):</b> a closed boundary has been felt everywhere; pressure everywhere falls at the same constant rate, dp/dt = constant. Decline analysis (Module 13) lives here.</li>
<li><b>Steady state:</b> a constant-pressure boundary (strong aquifer, balanced injection) makes ∂p/∂t = 0.</li>
</ul>
<p>Time to reach PSS (radius of investigation reaching r<sub>e</sub>):</p>
<div class="fx">r<sub>inv</sub> ≈ √(k t / (948 φ μ c<sub>t</sub>)) &nbsp;(ft, t in hr) ;&nbsp;&nbsp; t<sub>pss</sub> ≈ 948 φ μ c<sub>t</sub> r<sub>e</sub>²/k &nbsp;hr</div>
`},
{title:"Radial flow solutions, skin & superposition", type:"read", html:`
<h3>The line-source (Ei) solution — transient flow</h3>
<p>A well produced at constant rate q in an infinite reservoir:</p>
<div class="fx">p(r,t) = p<sub>i</sub> + <span class="frac"><span>70.6 q μ B</span><span>k h</span></span> · Ei( <span class="frac"><span>−948 φ μ c<sub>t</sub> r²</span><span>k t</span></span> )</div>
<p>For x &lt; 0.01 (i.e. at the wellbore after a short time), Ei(−x) ≈ ln(1.781x), giving the working equation of well testing:</p>
<div class="fx"><span class="lbl">Wellbore flowing pressure, transient</span>p<sub>wf</sub> = p<sub>i</sub> − <span class="frac"><span>162.6 q μ B</span><span>k h</span></span>[ log t + log<span class="frac"><span>k</span><span>φ μ c<sub>t</sub> r<sub>w</sub>²</span></span> − 3.23 + 0.87s ]</div>
<h3>Skin — the toll booth at the wellbore</h3>
<p>Drilling-mud invasion, perforation crush, partial penetration — or acid jobs and fractures — alter permeability in a thin annulus around the well. The <span class="keyterm">skin factor s</span> lumps this into an extra steady pressure drop:</p>
<div class="fx">Δp<sub>skin</sub> = <span class="frac"><span>141.2 q μ B</span><span>k h</span></span> · s ;&nbsp;&nbsp; s = ( <span class="frac"><span>k</span><span>k<sub>s</sub></span></span> − 1 ) ln<span class="frac"><span>r<sub>s</sub></span><span>r<sub>w</sub></span></span></div>
<p>s &gt; 0 damaged (s = +5 to +20 common), s = 0 unaltered, s &lt; 0 stimulated (acid ≈ −1 to −3; fracture ≈ −3 to −6). Flow efficiency FE = (p̄−p<sub>wf</sub>−Δp<sub>skin</sub>)/(p̄−p<sub>wf</sub>). The PSS inflow equation, used constantly for deliverability:</p>
<div class="fx"><span class="lbl">Pseudo-steady-state inflow</span>q = <span class="frac"><span>0.00708 k h (p̄ − p<sub>wf</sub>)</span><span>μ B [ ln(r<sub>e</sub>/r<sub>w</sub>) − 0.75 + s ]</span></span></div>
<h3>Superposition — many wells, many rates</h3>
<p>The diffusivity equation is linear, so solutions add. <b>In space:</b> the pressure drop at any point = sum of drops caused by each well. A no-flow fault is modelled by an <em>image well</em> mirrored across it. <b>In time:</b> a rate change from q₁ to q₂ at t₁ = original well at q₁ forever + a phantom well at (q₂−q₁) starting at t₁. This trick converts every messy rate history into a sum of clean constant-rate solutions — and is the mathematical engine behind buildup analysis (Module 11).</p>
<div class="lab" data-widget="radial"><div class="lh"><span class="dot"></span><b>Lab · Pressure Funnel Visualiser</b></div>
<div class="body"><div class="ctrl">
<label>Permeability k <b data-out="k"></b> md<input type="range" min="5" max="500" step="5" value="100" data-in="k"></label>
<label>Skin s <b data-out="s"></b><input type="range" min="-5" max="20" step="0.5" value="5" data-in="s"></label>
<label>Rate q <b data-out="q"></b> stb/d<input type="range" min="100" max="3000" step="50" value="800" data-in="q"></label>
</div>
<canvas width="720" height="380"></canvas>
<div class="readout"><div class="chip"><span>p<sub>wf</sub></span><b data-out="pwf"></b></div><div class="chip"><span>Δp across skin</span><b data-out="dps"></b></div><div class="chip"><span>Flow efficiency</span><b data-out="fe"></b></div></div>
<p style="font-size:12.5px;color:var(--dim);margin:0">The logarithmic “funnel”: most drawdown happens near the well, and skin adds a vertical cliff right at r<sub>w</sub>. Slide s negative and watch a stimulation job pay for itself.</p>
</div></div>
`},
{title:"Checkpoint · Module 10", type:"quiz", quiz:[
{q:"During pseudo-steady state in a closed reservoir…",opts:["Pressure is constant everywhere","dp/dt is the same constant everywhere","Pressure varies randomly","Only pwf declines"],a:1,why:"Once the boundary is felt, the whole tank depletes in unison — dp/dt = −qB/(ct·Vp)."},
{q:"The diffusivity η = k/(φμct) controls…",opts:["Ultimate recovery","How fast pressure disturbances propagate","Skin factor","Bubble point"],a:1,why:"High k, low storage (φct) or low μ lets pressure signals travel quickly — like thermal diffusivity for heat."},
{q:"A skin factor of s = +8 means…",opts:["Enhanced near-well permeability","Significant formation damage adding extra Δp at the wellbore","Fractured well","Zero drawdown"],a:1,why:"Positive skin is a damage toll; the extra Δp = 141.2qμB·s/kh can dominate total drawdown."},

{q:"The radius of investigation grows with…",opts:["√(kt/φμct)","t²","1/t","It doesn't grow"],a:0,why:"Diffusive propagation: rinv ∝ √(ηt) — quadrupling test time only doubles the investigated radius."},
{q:"In the PSS inflow equation the term −0.75 (i.e. ln(re/rw) − 3/4) arises from…",opts:["Skin","Using average reservoir pressure p̄ instead of pe","Gas slippage","Unit conversion"],a:1,why:"Volumetric averaging of the pressure profile replaces ln(re/rw) − 1/2 (pe form) with −3/4 for p̄."}

COURSE.push({
id:"m11", num:"11", title:"Well Test Analysis", depth:"3,150 – 3,300 m",
tag:"Dynamics",
blurb:"Drawdown and buildup tests: extracting permeability, skin and average pressure from a pressure gauge and a stopwatch.",
lessons:[
{title:"Drawdown tests", type:"read", html:`
<h3>The idea</h3>
<p>Flow a (previously static) well at constant rate and record p<sub>wf</sub>(t). The transient solution says p<sub>wf</sub> is linear in <b>log t</b>:</p>
<div class="fx">p<sub>wf</sub> = p<sub>i</sub> − m·log t − m[ log(k/(φμc<sub>t</sub>r<sub>w</sub>²)) − 3.23 + 0.87s ],&nbsp;&nbsp; m = <span class="frac"><span>162.6 q μ B</span><span>k h</span></span></div>
<p>So on semilog paper:</p>
<ul>
<li><b>Slope m (psi/cycle)</b> → permeability: <b>k = 162.6qμB/(mh)</b>.</li>
<li><b>p<sub>1hr</sub></b> (read on the straight line at t=1 hr) → skin:</li>
</ul>
<div class="fx">s = 1.151[ <span class="frac"><span>p<sub>i</sub> − p<sub>1hr</sub></span><span>m</span></span> − log<span class="frac"><span>k</span><span>φ μ c<sub>t</sub> r<sub>w</sub>²</span></span> + 3.23 ]</div>
<p><b>Early times are corrupted by wellbore storage</b> (the wellbore itself unloading fluid) — identified on a log-log plot of Δp vs t as a unit-slope line. The semilog straight line begins only after storage dies (rule of thumb: after ~1.5 log cycles from the end of the unit slope). Late times bend away as boundaries arrive. A <b>reservoir-limit test</b> exploits the late PSS data: dp/dt = constant gives connected pore volume V<sub>p</sub> = −0.234qB/(c<sub>t</sub>·dp/dt).</p>
`},
{title:"Buildup tests & the Horner plot", type:"read", html:`
<h3>Shut it in and let it speak</h3>
<p>Flow at rate q for time t<sub>p</sub>, then shut in and record the rising p<sub>ws</sub>(Δt). By superposition in time (well at +q since t=0, image at −q since t<sub>p</sub>):</p>
<div class="fx"><span class="lbl">Horner equation</span>p<sub>ws</sub> = p<sub>i</sub> − m · log<span class="frac"><span>t<sub>p</sub> + Δt</span><span>Δt</span></span>,&nbsp;&nbsp; m = <span class="frac"><span>162.6 q μ B</span><span>k h</span></span></div>
<p>Plot p<sub>ws</sub> vs the <span class="keyterm">Horner time ratio</span> (t<sub>p</sub>+Δt)/Δt on semilog axes (time runs right-to-left):</p>
<ul>
<li><b>Slope m</b> → k, exactly as in drawdown.</li>
<li><b>Extrapolate to ratio = 1</b> (infinite shut-in) → <b>p*</b>, ≈ p<sub>i</sub> for new wells; corrected to average pressure p̄ (MBH method) in developed reservoirs.</li>
<li><b>Skin</b> from p<sub>1hr</sub> on the straight line: s = 1.151[(p<sub>1hr</sub> − p<sub>wf,Δt=0</sub>)/m − log(k/(φμc<sub>t</sub>r<sub>w</sub>²)) + 3.23].</li>
</ul>
<p>Buildups are beloved because rate is exactly known (zero!) — no flow-metering noise. The <b>MDH plot</b> (p<sub>ws</sub> vs log Δt) is the short-producing-time simplification. Modern analysis adds the <b>pressure-derivative</b> log-log diagnostic: radial flow appears as a flat derivative plateau, storage as an early hump, boundaries as late-time rises — a fingerprint chart of the reservoir.</p>
<div class="lab" data-widget="horner"><div class="lh"><span class="dot"></span><b>Lab · Horner Analyst</b></div>
<div class="body"><div class="ctrl">
<label>True k <b data-out="k"></b> md<input type="range" min="10" max="400" step="5" value="80" data-in="k"></label>
<label>True skin <b data-out="s"></b><input type="range" min="-3" max="15" step="0.5" value="4" data-in="s"></label>
<label>Producing time t<sub>p</sub> <b data-out="tp"></b> hr<input type="range" min="24" max="720" step="24" value="240" data-in="tp"></label>
</div>
<canvas width="720" height="380"></canvas>
<div class="readout"><div class="chip"><span>Slope m</span><b data-out="m"></b></div><div class="chip"><span>k from slope</span><b data-out="kcalc"></b></div><div class="chip"><span>p* (extrapolated)</span><b data-out="pstar"></b></div></div>
<p style="font-size:12.5px;color:var(--dim);margin:0">Synthetic buildup data (q=500 stb/d, μ=1.2 cp, B=1.25, h=35 ft, p<sub>i</sub>=4,000 psia). The fitted semilog line recovers k from m = 162.6qμB/kh — verify the round trip.</p>
</div></div>
`},
{title:"Checkpoint · Module 11", type:"quiz", quiz:[
{q:"On a semilog drawdown plot, permeability comes from…",opts:["The intercept","The slope m via k = 162.6qμB/(mh)","The curvature","p at 10 hr"],a:1,why:"The transient solution is linear in log t with slope inversely proportional to kh."},
{q:"Early-time buildup/drawdown data deviate from the straight line because of…",opts:["Boundaries","Wellbore storage and skin","Gas cap","Water influx"],a:1,why:"The wellbore itself stores/unloads fluid; a unit slope on log-log Δp–t flags this period."},
{q:"The Horner time ratio at infinite shut-in equals…",opts:["0","1","tp","∞"],a:1,why:"As Δt→∞, (tp+Δt)/Δt → 1 — extrapolating the line there gives p*."},
{q:"A well test gives m = 50 psi/cycle with q=500 stb/d, μ=1.2 cp, B=1.25, h=30 ft. k ≈…",opts:["8 md","41 md","81 md","162 md"],a:2,why:"k = 162.6×500×1.2×1.25/(50×30) = 121,950/1,500 ≈ 81 md."},
{q:"On a pressure-derivative log-log plot, infinite-acting radial flow appears as…",opts:["A unit-slope line","A flat (horizontal) derivative plateau","A vertical asymptote","A sinusoid"],a:1,why:"The derivative of the semilog straight line is constant — the plateau whose level gives kh."}
]}
]});

COURSE.push({
id:"m12", num:"12", title:"Well Deliverability & Inflow Performance", depth:"3,300 – 3,450 m",
tag:"Production",
blurb:"PI, Vogel and Fetkovich IPRs, gas deliverability, and matching the reservoir's offer against the tubing's demand (nodal analysis).",
lessons:[
{title:"Productivity index & Vogel's IPR", type:"read", html:`
<h3>The straight-line PI — valid above bubble point</h3>
<div class="fx">J = <span class="frac"><span>q<sub>o</sub></span><span>p̄ − p<sub>wf</sub></span></span> &nbsp;stb/d/psi &nbsp;=&nbsp; <span class="frac"><span>0.00708 k<sub>o</sub> h</span><span>μ<sub>o</sub> B<sub>o</sub>[ln(r<sub>e</sub>/r<sub>w</sub>) − 0.75 + s]</span></span></div>
<p>The <span class="keyterm">inflow performance relationship (IPR)</span> is the full q vs p<sub>wf</sub> curve. Above p<sub>b</sub> it is a straight line of slope −1/J with absolute open flow (AOF) at p<sub>wf</sub>=0.</p>
<h3>Below the bubble point: Vogel</h3>
<p>Free gas near the wellbore cuts k<sub>ro</sub>, so each extra psi of drawdown buys less oil. Vogel's dimensionless curve (1968), fitted to simulations of many solution-gas-drive reservoirs:</p>
<div class="fx"><span class="frac"><span>q<sub>o</sub></span><span>q<sub>o,max</sub></span></span> = 1 − 0.2<span class="frac"><span>p<sub>wf</sub></span><span>p̄</span></span> − 0.8( <span class="frac"><span>p<sub>wf</sub></span><span>p̄</span></span> )²</div>
<p>For undersaturated reservoirs with p<sub>wf</sub> dipping below p<sub>b</sub>, use the <b>composite IPR</b>: straight-line PI down to p<sub>b</sub>, Vogel curvature beneath (q<sub>b</sub> = J(p̄−p<sub>b</sub>); q<sub>max</sub> = q<sub>b</sub> + Jp<sub>b</sub>/1.8). <b>Fetkovich's</b> alternative fits well tests with q = C(p̄²−p<sub>wf</sub>²)<sup>n</sup>. Future IPRs shrink as p̄ and k<sub>ro</sub> decline — Standing's and Fetkovich's adjustments scale q<sub>max</sub> accordingly.</p>
<div class="lab" data-widget="vogel"><div class="lh"><span class="dot"></span><b>Lab · IPR Builder (composite PI + Vogel)</b></div>
<div class="body"><div class="ctrl">
<label>Average pressure p̄ <b data-out="pr"></b> psia<input type="range" min="1500" max="5000" step="50" value="3200" data-in="pr"></label>
<label>Bubble point p<sub>b</sub> <b data-out="pb"></b> psia<input type="range" min="500" max="4500" step="50" value="2400" data-in="pb"></label>
<label>PI J <b data-out="j"></b> stb/d/psi<input type="range" min="0.2" max="5" step="0.1" value="1.2" data-in="j"></label>
<label>Target p<sub>wf</sub> <b data-out="pwf"></b> psia<input type="range" min="0" max="4500" step="50" value="1500" data-in="pwf"></label>
</div>
<canvas width="720" height="400"></canvas>
<div class="readout"><div class="chip"><span>Rate at target p<sub>wf</sub></span><b data-out="q"></b></div><div class="chip"><span>q at bubble point</span><b data-out="qb"></b></div><div class="chip"><span>AOF q<sub>max</sub></span><b data-out="qmax"></b></div></div>
<p style="font-size:12.5px;color:var(--dim);margin:0">Slide p<sub>b</sub> above p̄ and the whole curve goes Vogel; slide it to zero and you recover the straight-line PI. The kink is the bubble point walking through your drawdown.</p>
</div></div>
`},
{title:"Gas deliverability & nodal analysis", type:"read", html:`
<h3>Gas wells: back-pressure and LIT equations</h3>
<p>The classic four-point flow-after-flow test fits the <b>Rawlins–Schellhardt back-pressure equation</b>:</p>
<div class="fx">q<sub>g</sub> = C( p̄² − p<sub>wf</sub>² )<sup>n</sup>,&nbsp;&nbsp; 0.5 ≤ n ≤ 1.0</div>
<p>n=1 laminar, n→0.5 fully turbulent. Plot log(p̄²−p<sub>wf</sub>²) vs log q<sub>g</sub>: slope = 1/n; AOF read at p<sub>wf</sub>=14.7 psia. The theoretically grounded alternative is the <b>laminar–inertial–turbulent (LIT)</b> / Forchheimer form:</p>
<div class="fx">p̄² − p<sub>wf</sub>² = a q<sub>g</sub> + b q<sub>g</sub>² &nbsp;&nbsp;(a: Darcy flow, b: non-Darcy turbulence)</div>
<p>At high pressures (&gt;~3,000 psia) use pseudo-pressure m(p) = 2∫p/(μz)dp instead of p² for accuracy — the m(p) form is exact at all pressure levels.</p>
<h3>Nodal analysis — where offer meets demand</h3>
<p>The reservoir <em>offers</em> the IPR: more rate at lower p<sub>wf</sub>. The tubing <em>demands</em> the VLP/TPR (vertical lift performance): more rate needs more bottomhole pressure to carry friction and the fluid column — the multiphase-flow territory of Brill &amp; Mukherjee, with flow patterns (bubble, slug, churn, annular), holdup and friction correlations (Hagedorn–Brown, Beggs–Brill). Plot both curves on the same q–p<sub>wf</sub> axes:</p>
<div class="callout oil"><div class="ct">The operating point</div><p>The intersection of IPR and VLP is the natural flowing rate. No intersection? The well is dead — bring artificial lift (gas lift, ESP) or bigger tubing. Every production-engineering decision — tubing size, choke, compression, stimulation — is a deliberate reshaping of one of these two curves to move their intersection to a better place.</p></div>
`},
{title:"Checkpoint · Module 12", type:"quiz", quiz:[
{q:"Vogel's IPR curves below the bubble point because…",opts:["Water breaks through","Free gas reduces oil relative permeability near the wellbore","Tubing friction rises","Skin increases with rate"],a:1,why:"Below pb, liberated gas occupies pores and slashes kro — each psi of extra drawdown yields less incremental oil."},
{q:"With p̄=3,000 psia, qmax=2,000 stb/d, Vogel gives q at pwf=1,500 psia ≈…",opts:["700 stb/d","1,000 stb/d","1,400 stb/d","1,800 stb/d"],a:2,why:"pwf/p̄=0.5 → q/qmax = 1−0.2(0.5)−0.8(0.25) = 0.70 → q = 1,400 stb/d."},
{q:"In the back-pressure equation, n = 0.5 indicates…",opts:["Laminar Darcy flow","Fully turbulent (non-Darcy) flow","Measurement error","Water coning"],a:1,why:"The exponent falls from 1 (laminar) toward 0.5 as inertial/turbulent effects grow — common in high-rate gas wells."},
{q:"The natural flowing rate of a well is found where…",opts:["IPR crosses the VLP/tubing curve","IPR crosses the x-axis","VLP is at minimum","pwf = p̄"],a:0,why:"Reservoir offer = tubing demand: the nodal operating point."},
{q:"A composite IPR is needed when…",opts:["p̄ and pwf are both above pb","p̄ > pb but drawdown takes pwf below pb","The well is gas only","Skin is zero"],a:1,why:"Straight-line PI applies down to pb; Vogel curvature takes over beneath it."}
]}
]});
</script>

COURSE.push({
id:"m13", num:"13", title:"Decline Curve Analysis", depth:"3,450 – 3,550 m",
tag:"Production",
blurb:"Arps' exponential, hyperbolic and harmonic declines: reading the future of a well from its production history.",
lessons:[
{title:"The Arps family", type:"read", html:`
<h3>One parameter to rule them: b</h3>
<p>Arps (1945) observed that the <span class="keyterm">loss ratio</span> and its derivative organise nearly all boundary-dominated declines. Define decline rate D = −(dq/dt)/q. The family:</p>
<div class="fx"><span class="lbl">General hyperbolic (0 &lt; b &lt; 1)</span>q(t) = <span class="frac"><span>q<sub>i</sub></span><span>(1 + b D<sub>i</sub> t)<sup>1/b</sup></span></span>,&nbsp;&nbsp;N<sub>p</sub> = <span class="frac"><span>q<sub>i</sub><sup>b</sup></span><span>D<sub>i</sub>(1−b)</span></span>( q<sub>i</sub><sup>1−b</sup> − q<sup>1−b</sup> )</div>
<div class="fx"><span class="lbl">Exponential (b = 0) — constant D</span>q = q<sub>i</sub>e<sup>−Dt</sup>,&nbsp;&nbsp; N<sub>p</sub> = <span class="frac"><span>q<sub>i</sub> − q</span><span>D</span></span></div>
<div class="fx"><span class="lbl">Harmonic (b = 1)</span>q = <span class="frac"><span>q<sub>i</sub></span><span>1 + D<sub>i</sub>t</span></span>,&nbsp;&nbsp; N<sub>p</sub> = <span class="frac"><span>q<sub>i</sub></span><span>D<sub>i</sub></span></span> ln<span class="frac"><span>q<sub>i</sub></span><span>q</span></span></div>
<p>Diagnostics: exponential is a straight line on <b>log q vs t</b>; harmonic on <b>log q vs N<sub>p</sub></b>; exponential also straight on <b>q vs N<sub>p</sub></b>. Physical anchors: single-phase PSS depletion → b≈0; solution-gas drive → b≈0.1–0.4; layered no-crossflow and some water drives → b≈0.5–1. <b>b &gt; 1 is transient flow masquerading as decline</b> (ubiquitous in tight/unconventional wells) — extrapolating it gives fantasy EURs; switch to a terminal exponential decline (modified hyperbolic).</p>
<div class="lab" data-widget="decline"><div class="lh"><span class="dot"></span><b>Lab · Decline Simulator &amp; EUR Machine</b></div>
<div class="body"><div class="ctrl">
<label>q<sub>i</sub> <b data-out="qi"></b> stb/d<input type="range" min="200" max="5000" step="100" value="1500" data-in="qi"></label>
<label>D<sub>i</sub> <b data-out="di"></b> %/yr<input type="range" min="5" max="90" step="1" value="35" data-in="di"></label>
<label>b-factor <b data-out="b"></b><input type="range" min="0" max="1.4" step="0.05" value="0.4" data-in="b"></label>
<label>Economic limit <b data-out="ql"></b> stb/d<input type="range" min="10" max="300" step="10" value="50" data-in="ql"></label>
</div>
<canvas width="720" height="400"></canvas>
<div class="readout"><div class="chip"><span>Life to limit</span><b data-out="life"></b></div><div class="chip"><span>EUR (to limit)</span><b data-out="eur"></b></div></div>
<p style="font-size:12.5px;color:var(--dim);margin:0">Semilog rate–time plot. b=0 is a straight line; push b past 1 and watch the tail — and the EUR — inflate suspiciously. That fat tail is where unconventional reserves debates live.</p>
</div></div>
`},
{title:"Using DCA honestly", type:"read", html:`
<h3>The fine print</h3>
<p>Arps assumes: (1) boundary-dominated flow has begun, (2) constant operating conditions (choke, lift, pressure), (3) no changes in drainage or damage. Violate any of these and the fit forecasts the past, not the future. Discipline:</p>
<ul>
<li><b>Never fit transient data.</b> Early-life data (before t<sub>pss</sub>) always looks hyperbolic with large b.</li>
<li><b>Rate changes reset the clock.</b> A workover, choke change, or lift install creates a new decline segment.</li>
<li><b>Fit rate vs cumulative when time data is patchy</b> — q vs N<sub>p</sub> is robust to downtime.</li>
<li><b>Cross-check EUR</b> against volumetrics × RF and material balance. Three independent methods that agree are worth more than one perfect fit.</li>
</ul>
<div class="example"><div class="xh">Worked example — exponential well</div><div class="xb">
<p>A well declines exponentially from 900 stb/d at a nominal D = 24%/yr. Economic limit 45 stb/d. Find remaining life and EUR.</p>
<details class="step"><summary>Step 1 — life</summary><div class="sb">t = ln(qi/ql)/D = ln(20)/0.24 = 3.00/0.24 = <b>12.5 years</b>.</div></details>
<details class="step"><summary>Step 2 — EUR</summary><div class="sb">Np = (qi−ql)/D = (900−45)×365/0.24 = <b>≈ 1.30 MMstb</b>. (Converting D to per-day, 0.24/365, and rates in stb/d gives the same result — keep units honest.)</div></details>
</div></div>
<div class="callout"><div class="ct">Nominal vs effective decline</div><p>Nominal D is the instantaneous exponential rate (continuous compounding); effective decline d is the year-on-year fractional drop: d = 1 − e<sup>−D</sup> for exponential. Contracts and databases mix them freely — always ask which one a number is.</p></div>
`},
{title:"Checkpoint · Module 13", type:"quiz", quiz:[
{q:"On semilog rate–time paper, an exponential decline plots as…",opts:["A hyperbola","A straight line","A parabola","A step function"],a:1,why:"log q = log qi − Dt/2.303 — linear in t."},
{q:"A harmonic decline (b=1) plots straight on…",opts:["q vs t","log q vs Np","q vs √t","p/z vs Gp"],a:1,why:"Np = (qi/Di)ln(qi/q) rearranges to log q linear in Np."},
{q:"A tight-gas well fits b = 1.6 over its first year. You should…",opts:["Book the hyperbolic EUR proudly","Recognise transient flow and cap the forecast with a terminal exponential","Set b = 0 immediately","Double Di"],a:1,why:"b>1 during transient flow is not sustainable; modified hyperbolic (switch to exponential at a limiting decline) prevents runaway EURs."},
{q:"For b = 0, EUR to economic limit ql is…",opts:["(qi−ql)/D","qi/D·ln(qi/ql)","qi·ql·D","Cannot compute"],a:0,why:"Exponential cumulative: Np = (qi − q)/D."},
{q:"DCA fundamentally requires…",opts:["Transient flow","Boundary-dominated flow under constant operating conditions","A gas cap","Water injection"],a:1,why:"Arps declines are empirical descriptions of boundary-dominated depletion; changed conditions break the extrapolation."}
]}
]});

COURSE.push({
id:"m14", num:"14", title:"Waterflooding & Performance Prediction", depth:"3,550 – 3,650 m",
tag:"Production",
blurb:"Fractional flow, Buckley–Leverett frontal advance, Welge's tangent, mobility ratio — and the classic depletion predictors (Tarner, Muskat, Tracy).",
lessons:[
{title:"Fractional flow & Buckley–Leverett", type:"read", html:`
<h3>What fraction of the stream is water?</h3>
<p>For 1-D horizontal displacement, ignoring capillary gradients, the water cut at any point depends only on saturation via the rel-perm curves:</p>
<div class="fx"><span class="lbl">Fractional flow of water</span>f<sub>w</sub> = <span class="frac"><span>1</span><span>1 + <span class="frac"><span>k<sub>ro</sub></span><span>μ<sub>o</sub></span></span> · <span class="frac"><span>μ<sub>w</sub></span><span>k<sub>rw</sub></span></span></span></span></div>
<p>The S-shaped f<sub>w</sub>(S<sub>w</sub>) curve is the DNA of the flood. Its steepness is governed by the <span class="keyterm">mobility ratio</span>:</p>
<div class="fx">M = <span class="frac"><span>k<sub>rw</sub>°/μ<sub>w</sub></span><span>k<sub>ro</sub>°/μ<sub>o</sub></span></span> &nbsp;&nbsp;— M ≤ 1 favourable (piston-like), M ≫ 1 unfavourable (fingering, early breakthrough)</div>
<h3>Buckley–Leverett frontal advance (1942)</h3>
<p>Mass conservation says each saturation value travels at a speed proportional to the slope of f<sub>w</sub> at that saturation:</p>
<div class="fx"><span class="lbl">Frontal advance equation</span>( <span class="frac"><span>dx</span><span>dt</span></span> )<sub>S<sub>w</sub></sub> = <span class="frac"><span>5.615 q<sub>t</sub></span><span>φ A</span></span> · ( <span class="frac"><span>df<sub>w</sub></span><span>dS<sub>w</sub></span></span> )<sub>S<sub>w</sub></sub></div>
<p>Because f<sub>w</sub> is S-shaped, mid saturations would outrun low ones — a physical impossibility resolved by a <span class="keyterm">shock front</span>. <b>Welge's tangent construction</b> finds it: draw the tangent to f<sub>w</sub> from (S<sub>wc</sub>, 0). The tangency point gives the front saturation S<sub>wf</sub> and its water cut; the tangent's intersection with f<sub>w</sub>=1 reads the average saturation behind the front S̄<sub>w</sub>, hence recovery at breakthrough:</p>
<div class="fx">RF<sub>bt</sub> = <span class="frac"><span>S̄<sub>w</sub> − S<sub>wc</sub></span><span>1 − S<sub>wc</sub></span></span> &nbsp;(of movable-adjusted pore volume basis as defined)</div>
<p>After breakthrough, successive tangents at higher S<sub>w</sub> track the rising water cut and continuing (slower) recovery.</p>
<div class="lab" data-widget="bl"><div class="lh"><span class="dot"></span><b>Lab · Buckley–Leverett Flood Simulator</b></div>
<div class="body"><div class="ctrl">
<label>Oil viscosity μ<sub>o</sub> <b data-out="muo"></b> cp<input type="range" min="0.5" max="20" step="0.5" value="4" data-in="muo"></label>
<label>Water viscosity μ<sub>w</sub> <b data-out="muw"></b> cp<input type="range" min="0.3" max="1.2" step="0.05" value="0.5" data-in="muw"></label>
<label>S<sub>wc</sub> <b data-out="swc"></b><input type="range" min="0.1" max="0.35" step="0.01" value="0.2" data-in="swc"></label>
<label>S<sub>or</sub> <b data-out="sor"></b><input type="range" min="0.15" max="0.4" step="0.01" value="0.25" data-in="sor"></label>
</div>
<canvas width="720" height="400"></canvas>
<div class="readout"><div class="chip"><span>Mobility ratio M</span><b data-out="m"></b></div><div class="chip"><span>Front saturation S<sub>wf</sub></span><b data-out="swf"></b></div><div class="chip"><span>Water cut at breakthrough</span><b data-out="fwf"></b></div><div class="chip"><span>Recovery at breakthrough</span><b data-out="rf"></b></div></div>
<p style="font-size:12.5px;color:var(--dim);margin:0">The tangent line is Welge's construction, drawn live. Crank μ<sub>o</sub> up to 20 cp: the tangent point slides down, breakthrough comes early and wet — you are watching an unfavourable mobility ratio ruin a flood, and why polymer (thickening water) is the antidote.</p>
</div></div>
`},
{title:"Predicting depletion performance: Tarner, Muskat, Tracy", type:"read", html:`
<h3>Forecasting a solution-gas-drive reservoir</h3>
<p>Below the bubble point, MB alone has two unknowns per pressure step (N<sub>p</sub>, G<sub>p</sub>). Pair it with the <span class="keyterm">instantaneous GOR equation</span> — a statement about flow, not volume:</p>
<div class="fx">R = R<sub>s</sub> + <span class="frac"><span>k<sub>g</sub></span><span>k<sub>o</sub></span></span> · <span class="frac"><span>μ<sub>o</sub>B<sub>o</sub></span><span>μ<sub>g</sub>B<sub>g</sub></span></span></div>
<p>and a saturation equation to enter the k<sub>g</sub>/k<sub>o</sub> curve:</p>
<div class="fx">S<sub>o</sub> = (1 − S<sub>wc</sub>)(1 − <span class="frac"><span>N<sub>p</sub></span><span>N</span></span>)<span class="frac"><span>B<sub>o</sub></span><span>B<sub>oi</sub></span></span></div>
<p>The three classic iteration schemes, all marching pressure downward in steps:</p>
<ul>
<li><b>Tarner:</b> guess ΔN<sub>p</sub> for the step → compute G<sub>p</sub> from MB and, separately, from the GOR equation (trapezoidal average of R) → adjust ΔN<sub>p</sub> until both agree.</li>
<li><b>Muskat:</b> differential form — express dS<sub>o</sub>/dp analytically from MB + GOR and integrate numerically; elegant, sensitive to PVT-derivative accuracy.</li>
<li><b>Tracy:</b> reorganises MB with pressure-dependent functions Φ<sub>n</sub>, Φ<sub>g</sub> (and Φ<sub>w</sub>) so each step solves 1 = Φ<sub>n</sub>ΔN<sub>p</sub>-style relations quickly — the favourite for hand and spreadsheet work.</li>
</ul>
<p>Output: N<sub>p</sub>, G<sub>p</sub>, R and S<sub>o</sub> versus pressure — the primary-recovery forecast, and the baseline against which waterflood or gas-injection projects are justified. (Full-field, multi-well, heterogeneous forecasting is the job of numerical reservoir simulation — conceptually just this workflow solved on thousands of connected tanks.)</p>
<div class="callout oil"><div class="ct">History matching</div><p>Before any model forecasts, it must reproduce the past: adjust the least-known parameters (aquifer size, rel-perm curves, compartment volumes) within plausible ranges until computed pressures/GOR/water cut track the measured history. A matched model is not necessarily <em>right</em> — matches are non-unique — but an unmatched model is certainly wrong.</p></div>
`},
{title:"Checkpoint · Module 14", type:"quiz", quiz:[
{q:"The fractional flow of water increases when…",opts:["μo decreases","kro increases","μo increases (heavier oil)","Swc increases at fixed Sw"],a:2,why:"fw = 1/(1 + (kro·μw)/(krw·μo)) — heavier oil (higher μo) makes the denominator smaller, so fw rises: water preferentially flows."},
{q:"In Welge's construction, the tangent from (Swc, 0) to the fw curve gives…",opts:["Residual oil","The shock-front saturation and breakthrough water cut","Bubble point","Aquifer size"],a:1,why:"Tangency point = Swf and fw at the front; the tangent extended to fw=1 reads the average Sw behind the front."},
{q:"A mobility ratio M = 5 implies…",opts:["Piston-like displacement","Water fingers ahead — early breakthrough, poor sweep","Oil moves faster than water","No displacement at all"],a:1,why:"M>1 means water is more mobile than oil; instability and channelling degrade sweep efficiency."},
{q:"The instantaneous GOR equation adds to material balance the information about…",opts:["Rock volume","Relative flow of free gas vs oil (kg/ko)","Aquifer influx","Skin"],a:1,why:"R = Rs + (kg/ko)(μoBo/μgBg) couples fluid flow to volumetric depletion, closing the prediction system."},
{q:"Tracy's method is essentially…",opts:["A graphical p/z tool","Material balance reorganised with pressure-dependent Φ functions for fast stepwise solution","A decline curve","An aquifer model"],a:1,why:"Tracy tabulates Φn, Φg once per pressure and iterates each step rapidly — the classic spreadsheet predictor."}
]}
]});

COURSE.push({
id:"m15", num:"15", title:"The Proving Ground — Integrated Field Problems", depth:"3,650 m · TD",

blurb:"Four multi-step field problems that chain modules together the way real assets do. Attempt each on paper before opening the solution steps.",
lessons:[
{title:"Problem 1 · Appraising the Okoro discovery", type:"read", html:`
<h3>Scenario</h3>
<p>An exploration well finds oil. RFT points: <b>gas leg</b> 2,912 psia @ 6,200 ft (G<sub>g</sub>=0.08 psi/ft); <b>oil leg</b> 3,060 psia @ 6,700 ft (G<sub>o</sub>=0.33); <b>water leg</b> 3,305 psia @ 7,150 ft (G<sub>w</sub>=0.465). Mapping gives oil-column area 2,600 ac (use net pay = oil column × NTG 0.75), φ=0.24, S<sub>wi</sub>=0.22, B<sub>oi</sub>=1.36.</p>
<p><b>Tasks:</b> (a) locate GOC and OWC; (b) oil column thickness; (c) OOIP; (d) reserves at RF=0.34.</p>
<details class="step"><summary>Solution (a) — contacts</summary><div class="sb">Gas line: p = 2912 + 0.08(D−6200). Oil line: p = 3060 + 0.33(D−6700). Equate: 2912+0.08D−496 = 3060+0.33D−2211 → 2416+0.08D = 849+0.33D → 0.25D = 1567 → <b>GOC = 6,268 ft</b>.<br>Oil vs water: 3060+0.33(D−6700) = 3305+0.465(D−7150) → 849+0.33D = −19.75+0.465D → 0.135D = 868.75 → <b>OWC = 6,435 ft</b>.</div></details>
<details class="step"><summary>Solution (b) — column</summary><div class="sb">Oil column = 6,435 − 6,268 = <b>167 ft</b> gross → net pay h = 167×0.75 ≈ 125 ft.</div></details>
<details class="step"><summary>Solution (c) — OOIP</summary><div class="sb">N = 7758×2600×125×0.24×(1−0.22)/1.36 = 7758×2600×125×0.24×0.78/1.36 ≈ <b>347 MMstb</b>.</div></details>
<details class="step"><summary>Solution (d) — reserves</summary><div class="sb">Reserves = 347×0.34 ≈ <b>118 MMstb</b>. Next appraisal priorities: confirm NTG and contacts on the flanks (largest sensitivities), sample PVT before depletion.</div></details>
`},
{title:"Problem 2 · How big is the gas field really?", type:"read", html:`
<h3>Scenario</h3>
<p>A gas reservoir (T=210°F, γ<sub>g</sub>=0.68) has surveys:</p>
<table class="data"><tr><th>G<sub>p</sub> (Bscf)</th><th>p (psia)</th><th>z</th></tr>
<tr><td>0</td><td>4,850</td><td>0.982</td></tr><tr><td>150</td><td>4,275</td><td>0.943</td></tr><tr><td>310</td><td>3,680</td><td>0.910</td></tr><tr><td>480</td><td>3,020</td><td>0.883</td></tr></table>
<p><b>Tasks:</b> (a) OGIP by p/z; (b) reserves at abandonment p/z = 850 psia; (c) after these surveys, later points start plotting <em>above</em> the established line — diagnose and state the risk.</p>
<details class="step"><summary>Solution (a) — p/z line</summary><div class="sb">p/z values: 4,939 · 4,533 · 4,044 · 3,420. Regressing vs Gp: slope ≈ −(4939−3420)/480 = −3.165 psia/Bscf; intercept ≈ 4,939. <b>G = 4939/3.165 ≈ 1,560 Bscf</b>.</div></details>
<details class="step"><summary>Solution (b) — reserves</summary><div class="sb">G<sub>p,ab</sub> = G(1 − 850/4939) = 1560×0.828 ≈ <b>1,292 Bscf</b> (RF ≈ 83%).</div></details>
<details class="step"><summary>Solution (c) — the bend</summary><div class="sb">Points rising above the line = pressure support = <b>water influx</b>. Risks: OGIP from the early line is an over-estimate of recoverable volume behaviour — water-drive gas recovery may fall to 50–70% because gas is trapped at high pressure behind the flood front; wells will also water out. Actions: Cole/Havlena–Odeh diagnostics, fit an aquifer model (Module 9), consider accelerating offtake (blowdown) to outrun the water.</div></details>
`},
{title:"Problem 3 · The damaged well", type:"read", html:`
<h3>Scenario</h3>
<p>A new oil well (q=650 stb/d, μ=1.1 cp, B=1.28, h=42 ft, φ=0.21, c<sub>t</sub>=9×10⁻⁶ psi⁻¹, r<sub>w</sub>=0.354 ft, p<sub>wf</sub> at shut-in = 2,470 psia) is shut in for a buildup after t<sub>p</sub>=360 hr. The Horner straight line has slope m = 62 psi/cycle, p<sub>1hr</sub> = 3,065 psia and extrapolates to p* = 3,610 psia.</p>
<p><b>Tasks:</b> (a) k; (b) skin; (c) Δp<sub>skin</sub> and flow efficiency; (d) is stimulation worth it if removing skin roughly doubles J?</p>
<details class="step"><summary>Solution (a) — permeability</summary><div class="sb">k = 162.6qμB/(mh) = 162.6×650×1.1×1.28/(62×42) = 148,824/2,604 ≈ <b>57 md</b>.</div></details>
<details class="step"><summary>Solution (b) — skin</summary><div class="sb">s = 1.151[(p<sub>1hr</sub>−p<sub>wf,0</sub>)/m − log(k/(φμc<sub>t</sub>r<sub>w</sub>²)) + 3.23]<br>k/(φμc<sub>t</sub>r<sub>w</sub>²) = 57/(0.21×1.1×9e-6×0.1253) = 57/(2.605e-7) = 2.19e8 → log = 8.34.<br>s = 1.151[(3065−2470)/62 − 8.34 + 3.23] = 1.151[9.597 − 5.11] = 1.151×4.487 ≈ <b>+5.2</b> — damaged.</div></details>
<details class="step"><summary>Solution (c) — skin cost</summary><div class="sb">Δp<sub>skin</sub> = 141.2qμB·s/(kh) = 141.2×650×1.1×1.28×5.2/(57×42) = 671,900/2,394 ≈ <b>281 psi</b>. Ideal drawdown = (p*−p<sub>wf</sub>) − Δp<sub>skin</sub> = 1,140−281 = 859 psi. FE ≈ 859/1,140 ≈ <b>0.75</b> — a quarter of the drawdown is wasted crossing damage.</div></details>
<details class="step"><summary>Solution (d) — decision</summary><div class="sb">Removing s → q rises roughly by 1/FE ≈ 33% at the same drawdown (≈ +215 stb/d). At any realistic oil price this pays for a matrix acid job within weeks. Recommend stimulation, then re-test to confirm s ≈ 0.</div></details>
`},
{title:"Problem 4 · Designing the waterflood", type:"read", html:`
<h3>Scenario</h3>
<p>A depleting solution-gas-drive reservoir (N = 120 MMstb, current RF only 11%) is screened for waterflood. Rel perms: S<sub>wc</sub>=0.22, S<sub>or</sub>=0.28, k<sub>rw</sub>°=0.32, k<sub>ro</sub>°=0.85, n<sub>w</sub>=2.6, n<sub>o</sub>=2.0. Fluids: μ<sub>o</sub>=3.2 cp, μ<sub>w</sub>=0.55 cp.</p>
<p><b>Tasks:</b> (a) mobility ratio — is the flood stable? (b) using Welge (the Module-14 lab reproduces this), S<sub>wf</sub>≈0.52, f<sub>wf</sub>≈0.78, S̄<sub>w</sub>≈0.60 — displacement efficiency at breakthrough; (c) incremental recovery estimate if areal×vertical sweep ≈ 0.65; (d) two design levers if M had been unfavourable.</p>
<details class="step"><summary>Solution (a) — M</summary><div class="sb">M = (k<sub>rw</sub>°/μ<sub>w</sub>)/(k<sub>ro</sub>°/μ<sub>o</sub>) = (0.32/0.55)/(0.85/3.2) = 0.582/0.266 ≈ <b>2.2</b>. Mildly unfavourable — workable, expect some early water and imperfect sweep.</div></details>
<details class="step"><summary>Solution (b) — displacement efficiency</summary><div class="sb">E<sub>D,bt</sub> = (S̄<sub>w</sub> − S<sub>wc</sub>)/(1 − S<sub>wc</sub>) = (0.60−0.22)/0.78 ≈ <b>0.49</b> of the oil in the swept zone displaced at breakthrough; continued injection after breakthrough pushes S̄<sub>w</sub> toward 1−S<sub>or</sub>=0.72, i.e. E<sub>D,ult</sub> → (0.72−0.22)/0.78 ≈ 0.64.</div></details>
<details class="step"><summary>Solution (c) — recovery</summary><div class="sb">Ultimate flood RF ≈ E<sub>D</sub>×E<sub>vol</sub> = 0.64×0.65 ≈ 0.42 of OOIP in the flooded region. Incremental over the 11% primary ≈ 0.42−0.11 ≈ 30% × 120 MMstb ≈ <b>~36 MMstb incremental</b> — before economics, pattern design and timing refine it. (Order-of-magnitude screening, exactly how real projects start.)</div></details>
<details class="step"><summary>Solution (d) — levers</summary><div class="sb">1) <b>Polymer</b> in the injection water raises μ<sub>w</sub>, cutting M toward 1 (chemical EOR's entry move). 2) <b>Pattern & rate design</b> — closer spacing, balanced voidage-replacement, and injecting below fracture pressure improve sweep; in dipping reservoirs, inject down-dip and let gravity help.</div></details>
<div class="callout oil"><div class="ct">You have reached total depth</div><p>Volumetrics told you what's there; material balance told you what's connected; flow physics told you how fast; declines and displacement theory told you the future. That is the whole discipline in one drilling run. Go back up the column and replay any lab — mastery is when the sliders stop surprising you.</p></div>
`}
]});
</script>
<script>
/* =================== ENGINE =================== */
const $ = s => document.querySelector(s);
const main = $("#main");
let store = { done:{}, scores:{} };
try{ const raw = localStorage.getItem("strata-progress"); if(raw) store = JSON.parse(raw); }catch(e){}
function save(){ try{ localStorage.setItem("strata-progress", JSON.stringify(store)); }catch(e){} }

const totalLessons = COURSE.reduce((s,m)=>s+m.lessons.length,0);
function doneCount(){ return Object.keys(store.done).length; }
function modProgress(m){ const d = m.lessons.filter((_,i)=>store.done[m.id+":"+i]).length; return d/m.lessons.length; }

let state = { view:"home", mi:0, li:0 };

function esc(s){return s;}
function renderSidebar(){
  const list = $("#navList"); list.innerHTML = "";
  COURSE.forEach((m,mi)=>{
    const p = modProgress(m);
    const b = document.createElement("button");
    b.className = "stratum" + (p>=1?" done":"") + (state.view!=="home"&&state.mi===mi?" current":"");
    b.innerHTML = '<span class="pipe"><span class="node"></span></span><span class="layer">'+
      '<span class="lt">'+m.num+' · '+m.title+'</span>'+
      '<span class="ld"><span>'+m.depth+'</span><span class="pct">'+Math.round(p*100)+'%</span></span></span>';
    b.onclick = ()=>{ go("module", mi); closeMenu(); };
    list.appendChild(b);
  });
  const pct = doneCount()/totalLessons;
  const depth = Math.round(3650*pct);
  $("#drillDepth").innerHTML = "Drill bit at <b>"+depth.toLocaleString()+" m</b> of 3,650 m · "+doneCount()+"/"+totalLessons+" lessons";
  $("#pctTxt").textContent = Math.round(pct*100)+"%";
  $("#pctBar").style.width = (pct*100)+"%";
}

function go(view, mi, li){
  state = { view, mi:mi||0, li:li||0 };
  renderSidebar();
  if(view==="home") renderHome();
  else if(view==="module") renderModule(mi);
  else renderLesson(mi, li);
  window.scrollTo({top:0});
  main.focus({preventScroll:true});
}

function renderHome(){
  let cards = COURSE.map((m,mi)=>{
    const p = Math.round(modProgress(m)*100);
    return '<div class="card" onclick="go(\'module\','+mi+')" tabindex="0" role="button">'+
      '<div class="k"><span>MODULE '+m.num+'</span><span>'+m.depth+'</span></div>'+
      '<h3>'+m.title+'</h3><p>'+m.blurb+'</p>'+
      '<div class="meter"><i style="width:'+p+'%"></i></div></div>';
  }).join("");
  const pct = Math.round(doneCount()/totalLessons*100);
  main.innerHTML = '<div class="hero"><h1>Drill through the discipline, one stratum at a time.</h1>'+
   '<p>A complete interactive academy built on <em>Reservoir Engineering: Fundamentals and Applications</em> (Okotie &amp; Ikporo), reinforced with Dake, Craft &amp; Hawkins, and Brill &amp; Mukherjee. Fifteen modules, ten live laboratories, seventy checkpoint questions, four integrated field problems. Every formula derived, every concept made touchable.</p>'+
   '<div class="cta"><button class="btn primary" onclick="go(\'lesson\',0,0)">'+(pct>0?"Continue drilling":"Spud the well — start Module 01")+'</button>'+
   '<button class="btn" onclick="go(\'module\',14)">Skip to the Proving Ground</button></div></div>'+
   '<div class="crumb">The column · <span>'+pct+'% drilled</span></div>'+
   '<div class="grid">'+cards+'</div>';
}

function renderModule(mi){
  const m = COURSE[mi];
  const rows = m.lessons.map((l,li)=>{
    const done = store.done[m.id+":"+li];
    const tag = l.type==="quiz" ? '<span class="tag quiz">Checkpoint</span>' : (l.html && l.html.indexOf("data-widget")>-1 ? '<span class="tag lab">Lesson + Lab</span>' : '<span class="tag">Lesson</span>');
    return '<div class="lrow" onclick="go(\'lesson\','+mi+','+li+')" tabindex="0" role="button">'+
      '<span class="idx">'+m.num+'.'+(li+1)+'</span><span class="t">'+l.title+'</span>'+tag+
      '<span class="tick">'+(done?"✓":"")+'</span></div>';
  }).join("");
  main.innerHTML = '<div class="crumb">Module '+m.num+' · <span>'+m.depth+'</span> · '+m.tag+'</div>'+
    '<h1 class="pagetitle">'+m.title+'</h1><p class="lede">'+m.blurb+'</p>'+
    '<div class="lesson-list">'+rows+'</div>';
}

function renderLesson(mi, li){
  const m = COURSE[mi], l = m.lessons[li];
  let inner = '<div class="crumb">Module '+m.num+' · <span>'+m.title+'</span> · '+m.depth+'</div>'+
    '<h1 class="pagetitle">'+m.num+'.'+(li+1)+' — '+l.title+'</h1>';
  if(l.type==="quiz"){
    inner += '<p class="lede">Answer all questions. Explanations appear after each answer — read them even when you are right.</p><div class="quiz" id="quizBox"></div><div class="quiz-score" id="quizScore"></div>';
  } else {
    inner += '<article class="lesson">'+l.html+'</article>';
    inner += '<button class="btn primary done-btn" id="doneBtn">'+(store.done[m.id+":"+li]?"✓ Completed — mark again":"Mark lesson complete")+'</button>';
  }
  const hasPrev = li>0 || mi>0, hasNext = li<m.lessons.length-1 || mi<COURSE.length-1;
  inner += '<div class="lesson-nav">'+
    (hasPrev?'<button class="btn" id="prevBtn">← Previous</button>':'<span></span>')+
    (hasNext?'<button class="btn" id="nextBtn">Next →</button>':'<button class="btn" onclick="go(\'home\')">Back to the column</button>')+'</div>';
  main.innerHTML = inner;
  if(l.type==="quiz") buildQuiz(m, li, l.quiz);
  else $("#doneBtn").onclick = ()=>{ store.done[m.id+":"+li]=1; save(); renderSidebar(); $("#doneBtn").textContent="✓ Completed"; };
  if(hasPrev) $("#prevBtn").onclick = ()=>{ if(li>0) go("lesson",mi,li-1); else go("lesson",mi-1,COURSE[mi-1].lessons.length-1); };
  if(hasNext && $("#nextBtn")) $("#nextBtn").onclick = ()=>{ if(li<m.lessons.length-1) go("lesson",mi,li+1); else go("lesson",mi+1,0); };
  document.querySelectorAll("[data-widget]").forEach(elm=>{
    const w = WIDGETS[elm.getAttribute("data-widget")];
    if(w) try{ w(elm); }catch(e){ console.error(e); }
  });
}

function buildQuiz(m, li, qs){
  const box = $("#quizBox");
  let answered = 0, correct = 0;
  qs.forEach((qq,qi)=>{
    const qd = document.createElement("div"); qd.className="q";
    qd.innerHTML = '<div class="qt">'+(qi+1)+'. '+qq.q+'</div>';
    qq.opts.forEach((o,oi)=>{
      const b = document.createElement("button"); b.className="opt"; b.textContent=o;
      b.onclick = ()=>{
        if(qd.classList.contains("answered")) return;
        qd.classList.add("answered"); answered++;
        if(oi===qq.a){ b.classList.add("correct"); correct++; }
        else { b.classList.add("wrong"); qd.querySelectorAll(".opt")[qq.a].classList.add("correct"); }
        if(answered===qs.length){
          const sc = $("#quizScore");
          sc.style.display="block";
          const pct = Math.round(correct/qs.length*100);
          sc.innerHTML = '<b>'+correct+' / '+qs.length+'</b> &nbsp;('+pct+'%) — '+
            (pct===100?"Flawless. The stratum is yours.":pct>=70?"Solid. Review the misses, then drill on.":"Worth a re-read of the module before continuing — the deeper strata build on this one.");
          store.done[m.id+":"+li]=1; store.scores[m.id]=pct; save(); renderSidebar();
        }
      };
      qd.appendChild(b);
    });
    const w = document.createElement("div"); w.className="why"; w.textContent = qq.why; qd.appendChild(w);
    box.appendChild(qd);
  });
}

/* menu (mobile) */
function closeMenu(){ $("#sidebar").classList.remove("open"); }
$("#menuBtn").onclick = ()=> $("#sidebar").classList.toggle("open");

/* =================== WIDGET TOOLKIT =================== */
function ctl(root){
  const ins = {}, outs = {};
  root.querySelectorAll("[data-in]").forEach(i=>ins[i.getAttribute("data-in")]=i);
  root.querySelectorAll("[data-out]").forEach(o=>outs[o.getAttribute("data-out")]=o);
  return {ins, outs, v:k=>parseFloat(ins[k].value), set:(k,t)=>{ if(outs[k]) outs[k].textContent=t; }};
}
function canvasOf(root){
  const c = root.querySelector("canvas");
  const ctx = c.getContext("2d");
  return {c, ctx, W:c.width, H:c.height};
}
function axes(ctx, x0,y0,x1,y1, opts){
  ctx.strokeStyle="#24354F"; ctx.lineWidth=1; ctx.beginPath();
  ctx.moveTo(x0,y0); ctx.lineTo(x0,y1); ctx.lineTo(x1,y1); ctx.stroke();
  ctx.fillStyle="#9AA9BF"; ctx.font="12px ui-monospace,monospace";
  if(opts && opts.xl) { ctx.fillText(opts.xl, (x0+x1)/2-30, y1+28); }
  if(opts && opts.yl){ ctx.save(); ctx.translate(x0-42, (y0+y1)/2+30); ctx.rotate(-Math.PI/2); ctx.fillText(opts.yl,0,0); ctx.restore(); }
}
function fmt(n,d){ return Number(n.toFixed(d===undefined?1:d)).toLocaleString(); }

const WIDGETS = {};

/* --- M2: contact finder --- */
WIDGETS.contacts = function(root){
  const C = ctl(root), K = canvasOf(root);
  function draw(){
    const gg=C.v("gg"), go=C.v("go"), gw=C.v("gw"), po=C.v("po");
    C.set("gg",gg.toFixed(3)); C.set("go",go.toFixed(3)); C.set("gw",gw.toFixed(3)); C.set("po",po);
    const Dref=7000, pgRef = po - 45, DgRef = 6300;      // gas point above
    const pwRef = 3344, DwRef = 7320;
    // lines: p(D) = pref + G*(D - Dref)
    const goc = ((po - go*Dref) - (pgRef - gg*DgRef)) / (gg - go);
    const owc = ((po - go*Dref) - (pwRef - gw*DwRef)) / (gw - go);
    C.set("goc", fmt(goc,0)+" ft"); C.set("owc", fmt(owc,0)+" ft");
    const {ctx,W,H} = K; ctx.clearRect(0,0,W,H);
    const Dmin=6100, Dmax=7500, Pmin=2900, Pmax=3500;

    const Y = d => 30 + (d-Dmin)/(Dmax-Dmin)*(H-90);

    function line(pref,Dref2,G,color,d0,d1){
      ctx.strokeStyle=color; ctx.lineWidth=2.5; ctx.beginPath();
      ctx.moveTo(X(pref+G*(d0-Dref2)), Y(d0)); ctx.lineTo(X(pref+G*(d1-Dref2)), Y(d1)); ctx.stroke();
    }
    line(pgRef,DgRef,gg,"#8FD0B8",Dmin,goc);

    [ [goc,"GOC"], [owc,"OWC"] ].forEach(([d,lab])=>{
      ctx.strokeStyle="rgba(233,238,246,.35)"; ctx.setLineDash([5,5]); ctx.beginPath();
      ctx.moveTo(70,Y(d)); ctx.lineTo(W-30,Y(d)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#E9EEF6"; ctx.font="12px ui-monospace,monospace";

    ctx.fillStyle="#8FD0B8"; ctx.fillText("gas 0."+Math.round(gg*1000)/10, 90, 60);
    ctx.fillStyle="#F2A93B"; ctx.fillText("oil", 90, Y((goc+owc)/2));
    ctx.fillStyle="#57AECB"; ctx.fillText("water", 90, H-80);
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M4: DAK z-factor --- */
function zDAK(ppr, tpr){
  if(ppr<=0) return 1;
  const A=[0,0.3265,-1.0700,-0.5339,0.01569,-0.05165,0.5475,-0.7361,0.1844,0.1056,0.6134,0.7210];
  let z=1;
  for(let it=0; it<80; it++){
    const rr = 0.27*ppr/(z*tpr);
    const t1 = A[1] + A[2]/tpr + A[3]/Math.pow(tpr,3) + A[4]/Math.pow(tpr,4) + A[5]/Math.pow(tpr,5);
    const t2 = A[6] + A[7]/tpr + A[8]/(tpr*tpr);
    const t3 = A[9]*(A[7]/tpr + A[8]/(tpr*tpr));
    const t4 = A[10]/Math.pow(tpr,3)*(1+A[11]*rr*rr)*rr*rr*Math.exp(-A[11]*rr*rr);
    const znew = 1 + t1*rr + t2*rr*rr - t3*Math.pow(rr,5) + t4;
    z = z + 0.5*(znew - z);
    if(Math.abs(znew-z)<1e-8) break;
  }
  return z;
}
WIDGETS.zfac = function(root){
  const C = ctl(root), K = canvasOf(root);
  function draw(){
    const sg=C.v("sg"), p=C.v("p"), tf=C.v("t");
    const T = tf+460;
    const tpc = 169.2 + 349.5*sg - 74.0*sg*sg;
    const ppc = 756.8 - 131.0*sg - 3.6*sg*sg;
    const tpr = T/tpc, ppr = p/ppc;
    const z = zDAK(ppr,tpr);
    const bg = 0.02827*z*T/p;
    C.set("pc", fmt(tpc,0)+" °R / "+fmt(ppc,0)+" psia");
    C.set("pr", tpr.toFixed(2)+" / "+ppr.toFixed(2));
    C.set("z", z.toFixed(4)); C.set("bg", bg.toFixed(5)+" ft³/scf");
    C.set("eg", fmt(1/bg,0)+" scf/ft³");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const pmax=8000;
    const X=pp=>70+(pp/pmax)*(W-100), Y=zz=>(H-60)-(zz-0.4)/(0.9)*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"pressure, psia", yl:"z"});
    for(let g=0.4;g<=1.31;g+=0.1){ ctx.fillStyle="#4a5a72"; ctx.font="11px ui-monospace,monospace"; ctx.fillText(g.toFixed(1),40,Y(g)+4); }
    for(let pp=0;pp<=pmax;pp+=2000){ ctx.fillStyle="#4a5a72"; ctx.fillText(pp,X(pp)-12,H-42); }
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2.5; ctx.beginPath();
    for(let pp=100;pp<=pmax;pp+=60){ const zz=zDAK(pp/ppc,tpr); const x=X(pp), y=Y(Math.min(1.3,Math.max(0.4,zz))); pp===100?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
    ctx.strokeStyle="rgba(233,238,246,.3)"; ctx.setLineDash([4,4]); ctx.beginPath();
    ctx.moveTo(70,Y(1)); ctx.lineTo(W-30,Y(1)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#E9EEF6"; ctx.beginPath(); ctx.arc(X(p),Y(Math.min(1.3,Math.max(0.4,z))),5,0,7); ctx.fill();
    ctx.fillStyle="#9AA9BF"; ctx.fillText("z = 1 (ideal)", W-140, Y(1)-6);
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M6: OOIP + Monte Carlo --- */
WIDGETS.ooip = function(root){
  const C = ctl(root), K = canvasOf(root);
  function tri(mode, spread){ // triangular sample around mode
    const lo=mode*(1-spread), hi=mode*(1+spread);
    const u=Math.random(), f=(mode-lo)/(hi-lo);
    return u<f ? lo+Math.sqrt(u*(hi-lo)*(mode-lo)) : hi-Math.sqrt((1-u)*(hi-lo)*(hi-mode));
  }
  function draw(){
    const a=C.v("a"),h=C.v("h"),phi=C.v("phi"),sw=C.v("sw"),boi=C.v("boi"),rf=C.v("rf");
    const N = 7758*a*h*phi*(1-sw)/boi;
    C.set("n",fmt(N/1e6,1)+" MMstb");
    const spreads={a:0.20,h:0.15,phi:0.10,sw:0.10,boi:0.05,rf:0.25};
    const trials=[];
    for(let i=0;i<5000;i++){
      const r = 7758*tri(a,spreads.a)*tri(h,spreads.h)*tri(phi,spreads.phi)*(1-tri(sw,spreads.sw))/tri(boi,spreads.boi)*tri(rf,spreads.rf);
      trials.push(r/1e6);
    }
    trials.sort((x,y)=>x-y);
    const p90=trials[Math.floor(0.10*5000)], p50=trials[2500], p10=trials[Math.floor(0.90*5000)];
    C.set("p90",fmt(p90,1)+" MMstb"); C.set("p50",fmt(p50,1)+" MMstb"); C.set("p10",fmt(p10,1)+" MMstb");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const lo=trials[0], hi=trials[4999], nb=40, bins=new Array(nb).fill(0);
    trials.forEach(t=>{ bins[Math.min(nb-1,Math.floor((t-lo)/(hi-lo)*nb))]++; });
    const bmax=Math.max(...bins);
    const X=i=>60+(i/nb)*(W-90), Y=v=>(H-50)-(v/bmax)*(H-80);
    axes(ctx,60,30,W-30,H-50,{xl:"recoverable, MMstb"});
    bins.forEach((b,i)=>{ ctx.fillStyle="rgba(242,169,59,.55)"; ctx.fillRect(X(i),Y(b),(W-90)/nb-1,(H-50)-Y(b)); });
    [[p90,"P90","#8FD0B8"],[p50,"P50","#E9EEF6"],[p10,"P10","#57AECB"]].forEach(([v,l,col])=>{
      const x=60+((v-lo)/(hi-lo))*(W-90);
      ctx.strokeStyle=col; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(x,30); ctx.lineTo(x,H-50); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle=col; ctx.font="12px ui-monospace,monospace"; ctx.fillText(l, x-12, 24);
    });
    ctx.fillStyle="#4a5a72";
    for(let g=0;g<=4;g++){ const v=lo+(hi-lo)*g/4; ctx.fillText(fmt(v,0), 60+(g/4)*(W-90)-12, H-32); }
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M8: p/z extrapolator --- */
WIDGETS.pz = function(root){
  const C0 = ctl(root), K = canvasOf(root);
  const rowsBox = root.querySelector("[data-rows]");
  const seed = [[0,4600],[60,4290],[120,3930],[190,3560],[250,3180]];
  seed.forEach((r,i)=>{
    const l1=document.createElement("label"); l1.innerHTML="G<sub>p</sub> #"+(i+1)+" (Bscf)";
    const i1=document.createElement("input"); i1.type="number"; i1.value=r[0]; i1.step=10; l1.appendChild(i1);
    const l2=document.createElement("label"); l2.innerHTML="p/z #"+(i+1)+" (psia)";
    const i2=document.createElement("input"); i2.type="number"; i2.value=r[1]; i2.step=10; l2.appendChild(i2);
    rowsBox.appendChild(l1); rowsBox.appendChild(l2);
  });
  const inputs = Array.from(rowsBox.querySelectorAll("input"));
  function draw(){
    const pts=[]; for(let i=0;i<inputs.length;i+=2){ const x=parseFloat(inputs[i].value), y=parseFloat(inputs[i+1].value); if(isFinite(x)&&isFinite(y)) pts.push([x,y]); }
    const n=pts.length;
    const sx=pts.reduce((s,p)=>s+p[0],0), sy=pts.reduce((s,p)=>s+p[1],0);
    const sxx=pts.reduce((s,p)=>s+p[0]*p[0],0), sxy=pts.reduce((s,p)=>s+p[0]*p[1],0);
    const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx), icpt=(sy-slope*sx)/n;
    const G = -icpt/slope;
    const pzab = C0.v("pzab");
    const res = G*(1-pzab/icpt);
    C0.set("g", isFinite(G)?fmt(G,0)+" Bscf":"—");
    C0.set("res", isFinite(res)?fmt(res,0)+" Bscf":"—");
    C0.set("rf", isFinite(res)?fmt(res/G*100,0)+"%":"—");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const xmax=Math.max(G*1.05, 300), ymax=Math.max(icpt*1.05, 5000);
    const X=x=>70+x/xmax*(W-100), Y=y=>(H-60)-y/ymax*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"cumulative gas Gp, Bscf", yl:"p/z, psia"});
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(X(0),Y(icpt)); ctx.lineTo(X(G),Y(0)); ctx.stroke();
    pts.forEach(p=>{ ctx.fillStyle="#E9EEF6"; ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),5,0,7); ctx.fill(); });
    ctx.strokeStyle="#57AECB"; ctx.setLineDash([5,4]); ctx.beginPath();
    ctx.moveTo(X(0),Y(pzab)); ctx.lineTo(X(G*(1-pzab/icpt)),Y(pzab)); ctx.lineTo(X(G*(1-pzab/icpt)),Y(0)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#57AECB"; ctx.font="12px ui-monospace,monospace"; ctx.fillText("abandonment p/z", 90, Y(pzab)-8);
    ctx.fillStyle="#F2A93B"; ctx.fillText("G = "+fmt(G,0)+" Bscf", X(G)-120, Y(0)-10);
    ctx.fillStyle="#4a5a72";
    for(let g=0;g<=4;g++){ ctx.fillText(fmt(xmax*g/4,0), X(xmax*g/4)-10, H-42); ctx.fillText(fmt(ymax*g/4,0), 22, Y(ymax*g/4)+4); }
  }
  inputs.forEach(i=>i.addEventListener("input",draw));
  Object.values(C0.ins).forEach(i=>i.addEventListener("input",draw));
  draw();
};

/* --- M10: radial pressure funnel --- */
WIDGETS.radial = function(root){
  const C = ctl(root), K = canvasOf(root);
  function draw(){
    const k=C.v("k"), s=C.v("s"), q=C.v("q");
    C.set("k",k); C.set("s",s); C.set("q",q);
    const mu=1.2,B=1.25,h=35,pe=4000,re=1500,rw=0.354;
    const coef=141.2*q*mu*B/(k*h);
    const pwf = pe - coef*(Math.log(re/rw)+s);
    const dps = coef*s;
    const ideal = pe - coef*Math.log(re/rw);
    const fe = (pe-pwf)!==0 ? (pe-ideal)/(pe-pwf) : 1;
    C.set("pwf", fmt(pwf,0)+" psia"); C.set("dps", fmt(dps,0)+" psi"); C.set("fe", fe.toFixed(2));
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const pmin=Math.min(pwf,1500), pmax=4100;
    const X=r=>70+(Math.log10(r/rw)/Math.log10(re/rw))*(W-100);
    const Y=p=>(H-60)-(p-pmin)/(pmax-pmin)*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"radius (log scale) →", yl:"pressure, psia"});
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2.5; ctx.beginPath();
    for(let i=0;i<=200;i++){ const r=rw*Math.pow(re/rw,i/200); const p=pe-coef*Math.log(re/r); const x=X(r),y=Y(p); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
    // skin cliff
    ctx.strokeStyle="#E4756B"; ctx.beginPath(); ctx.moveTo(X(rw),Y(pe-coef*Math.log(re/rw))); ctx.lineTo(X(rw),Y(pwf)); ctx.stroke();
    ctx.fillStyle="#E4756B"; ctx.font="12px ui-monospace,monospace";
    if(Math.abs(s)>0.01) ctx.fillText("Δp skin", X(rw)+8, Y((pwf+pe-coef*Math.log(re/rw))/2));
    ctx.fillStyle="#9AA9BF"; ctx.fillText("rw", X(rw)-6, H-42); ctx.fillText("re", X(re)-8, H-42);
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M11: Horner --- */
WIDGETS.horner = function(root){
  const C = ctl(root), K = canvasOf(root);
  function draw(){
    const k=C.v("k"), s=C.v("s"), tp=C.v("tp");
    C.set("k",k); C.set("s",s); C.set("tp",tp);
    const q=500,mu=1.2,B=1.25,h=35,pi=4000;
    const m = 162.6*q*mu*B/(k*h);
    // synth points
    const dts=[0.5,1,2,4,8,16,32,64,120,240];
    const pts = dts.map(dt=>{ const hr=(tp+dt)/dt; return [hr, pi - m*Math.log10(hr) + (Math.random()-0.5)*2]; });
    C.set("m", fmt(m,1)+" psi/cycle");
    C.set("kcalc", fmt(162.6*q*mu*B/(m*h),0)+" md");
    C.set("pstar", fmt(pi,0)+" psia");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const hrmax=Math.max(...pts.map(p=>p[0]));
    const lmax=Math.log10(hrmax);
    const pmin=pi-m*lmax-30, pmax=pi+30;
    const X=hr=>70+(1-Math.log10(hr)/lmax)*(W-100); // time right-to-left
    const Y=p=>(H-60)-(p-pmin)/(pmax-pmin)*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"Horner ratio (tp+Δt)/Δt  ← log, reversed", yl:"pws, psia"});
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2; ctx.beginPath();
    ctx.moveTo(X(hrmax),Y(pi-m*lmax)); ctx.lineTo(X(1),Y(pi)); ctx.stroke();
    pts.forEach(p=>{ ctx.fillStyle="#E9EEF6"; ctx.beginPath(); ctx.arc(X(p[0]),Y(p[1]),4.5,0,7); ctx.fill(); });
    ctx.fillStyle="#8FD0B8"; ctx.font="12px ui-monospace,monospace";
    ctx.fillText("p* = "+fmt(pi,0)+" @ ratio 1", X(1)-160, Y(pi)-8);
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M12: Vogel composite IPR --- */
WIDGETS.vogel = function(root){
  const C = ctl(root), K = canvasOf(root);
  function rate(pwf, pr, pb, J){
    if(pr<=pb){ // fully saturated: pure Vogel with qmax = J*pr/1.8
      const qmax=J*pr/1.8, x=pwf/pr;
      return Math.max(0,qmax*(1-0.2*x-0.8*x*x));
    }
    if(pwf>=pb) return J*(pr-pwf);
    const qb=J*(pr-pb), qv=J*pb/1.8, x=pwf/pb;
    return qb + qv*(1-0.2*x-0.8*x*x);
  }
  function draw(){
    const pr=C.v("pr"), pb=C.v("pb"), J=C.v("j"), pwf=Math.min(C.v("pwf"),pr);
    C.set("pr",pr); C.set("pb",pb); C.set("j",J.toFixed(1)); C.set("pwf",fmt(pwf,0));
    const qmax=rate(0,pr,pb,J), q=rate(pwf,pr,pb,J), qb=pr>pb?J*(pr-pb):0;
    C.set("q",fmt(q,0)+" stb/d"); C.set("qb",pr>pb?fmt(qb,0)+" stb/d":"— (saturated)"); C.set("qmax",fmt(qmax,0)+" stb/d");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const X=qq=>70+qq/(qmax*1.08)*(W-100), Y=p=>(H-60)-p/(pr*1.05)*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"oil rate q, stb/d", yl:"pwf, psia"});
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2.5; ctx.beginPath();
    for(let p=pr;p>=0;p-=pr/200){ const x=X(rate(p,pr,pb,J)), y=Y(p); p===pr?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
    if(pr>pb){ ctx.strokeStyle="rgba(233,238,246,.3)"; ctx.setLineDash([4,4]); ctx.beginPath();
      ctx.moveTo(70,Y(pb)); ctx.lineTo(W-30,Y(pb)); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#9AA9BF"; ctx.font="12px ui-monospace,monospace"; ctx.fillText("bubble point", W-150, Y(pb)-6); }
    ctx.fillStyle="#57AECB"; ctx.beginPath(); ctx.arc(X(q),Y(pwf),6,0,7); ctx.fill();
    ctx.fillStyle="#57AECB"; ctx.fillText("operating point", X(q)+10, Y(pwf)+4);
    ctx.fillStyle="#4a5a72";
    for(let g=0;g<=4;g++){ ctx.fillText(fmt(qmax*1.08*g/4,0), X(qmax*1.08*g/4)-14, H-42); ctx.fillText(fmt(pr*1.05*g/4,0), 22, Y(pr*1.05*g/4)+4); }
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M13: decline --- */
WIDGETS.decline = function(root){
  const C = ctl(root), K = canvasOf(root);
  function draw(){
    const qi=C.v("qi"), diy=C.v("di")/100, b=C.v("b"), ql=C.v("ql");
    C.set("qi",fmt(qi,0)); C.set("di",fmt(diy*100,0)); C.set("b",b.toFixed(2)); C.set("ql",ql);
    const Di=diy; // per year
    function q(t){ return b<0.001 ? qi*Math.exp(-Di*t) : qi/Math.pow(1+b*Di*t,1/b); }
    // life
    let life;
    if(b<0.001) life = Math.log(qi/ql)/Di;
    else life = (Math.pow(qi/ql,b)-1)/(b*Di);
    // EUR (stb): rates stb/d, t years → integrate q dt *365
    let eur;
    if(b<0.001) eur = (qi-ql)/Di*365;
    else if(Math.abs(b-1)<0.001) eur = qi/Di*Math.log(qi/ql)*365;
    else eur = Math.pow(qi,b)/(Di*(1-b))*(Math.pow(qi,1-b)-Math.pow(ql,1-b))*365;
    C.set("life", fmt(life,1)+" yr"); C.set("eur", fmt(eur/1e6,2)+" MMstb");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const tmax=Math.min(Math.max(life*1.15,5),60);
    const lqmax=Math.log10(qi*1.2), lqmin=Math.log10(Math.max(ql*0.5,5));
    const X=t=>70+t/tmax*(W-100), Y=qq=>(H-60)-(Math.log10(qq)-lqmin)/(lqmax-lqmin)*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"time, years", yl:"rate, stb/d (log)"});
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2.5; ctx.beginPath();
    for(let t=0;t<=tmax;t+=tmax/300){ const qq=Math.max(q(t),1); const x=X(t),y=Y(qq); t===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
    ctx.strokeStyle="#E4756B"; ctx.setLineDash([5,4]); ctx.beginPath(); ctx.moveTo(70,Y(ql)); ctx.lineTo(W-30,Y(ql)); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#E4756B"; ctx.font="12px ui-monospace,monospace"; ctx.fillText("economic limit", W-160, Y(ql)-6);
    ctx.fillStyle="#4a5a72";
    for(let g=0;g<=4;g++){ ctx.fillText(fmt(tmax*g/4,0), X(tmax*g/4)-6, H-42); }
    [10,100,1000,10000].forEach(v=>{ if(Math.log10(v)>lqmin&&Math.log10(v)<lqmax){ ctx.fillText(fmt(v,0),28,Y(v)+4); }});
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};

/* --- M14: Buckley-Leverett --- */
WIDGETS.bl = function(root){
  const C = ctl(root), K = canvasOf(root);
  function draw(){
    const muo=C.v("muo"), muw=C.v("muw"), swc=C.v("swc"), sor=C.v("sor");
    C.set("muo",muo.toFixed(1)); C.set("muw",muw.toFixed(2)); C.set("swc",swc.toFixed(2)); C.set("sor",sor.toFixed(2));
    const krwe=0.35, kroe=0.85, nw=2.5, no=2.0;
    function fw(sw){
      if(sw<=swc) return 0; if(sw>=1-sor) return 1;
      const sn=(sw-swc)/(1-swc-sor);
      const krw=krwe*Math.pow(sn,nw), kro=kroe*Math.pow(1-sn,no);
      return 1/(1+(kro*muw)/(krw*muo));
    }
    const M=(krwe/muw)/(kroe/muo);
    // Welge tangent from (swc,0): maximize fw/(sw-swc)
    let best=0,swf=swc+0.01;
    for(let sw=swc+0.005;sw<1-sor;sw+=0.001){
      const sl=fw(sw)/(sw-swc);
      if(sl>best){best=sl;swf=sw;}
    }
    const fwf=fw(swf);
    const swbar = swc + 1/best; // tangent hits fw=1 at sw = swc + 1/slope
    const rf=(swbar-swc)/(1-swc);
    C.set("m",M.toFixed(2)); C.set("swf",swf.toFixed(3)); C.set("fwf",(fwf*100).toFixed(0)+"%"); C.set("rf",(rf*100).toFixed(0)+"% (of OOIP basis 1−Swc)");
    const {ctx,W,H}=K; ctx.clearRect(0,0,W,H);
    const X=s=>70+s*(W-100), Y=f=>(H-60)-f*(H-90);
    axes(ctx,70,30,W-30,H-60,{xl:"water saturation Sw", yl:"fw"});
    for(let g=0;g<=1.001;g+=0.2){ ctx.fillStyle="#4a5a72"; ctx.font="11px ui-monospace,monospace";
      ctx.fillText(g.toFixed(1), X(g)-8, H-42); ctx.fillText(g.toFixed(1), 44, Y(g)+4); }
    ctx.strokeStyle="#57AECB"; ctx.lineWidth=2.5; ctx.beginPath();
    for(let s=0;s<=1.001;s+=0.004){ const x=X(s),y=Y(fw(s)); s===0?ctx.moveTo(x,y):ctx.lineTo(x,y);} ctx.stroke();
    // tangent
    ctx.strokeStyle="#F2A93B"; ctx.lineWidth=2; ctx.setLineDash([6,4]); ctx.beginPath();
    ctx.moveTo(X(swc),Y(0)); ctx.lineTo(X(Math.min(swbar,1)),Y(Math.min(best*(Math.min(swbar,1)-swc),1))); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle="#F2A93B"; ctx.beginPath(); ctx.arc(X(swf),Y(fwf),6,0,7); ctx.fill();
    ctx.font="12px ui-monospace,monospace";
    ctx.fillText("Swf, fwf (shock front)", X(swf)+10, Y(fwf)+14);
    ctx.fillStyle="#8FD0B8"; ctx.beginPath(); ctx.arc(X(Math.min(swbar,1)),Y(1),6,0,7); ctx.fill();
    ctx.fillText("S̄w behind front", X(Math.min(swbar,1))-90, Y(1)+18);
  }
  Object.values(C.ins).forEach(i=>i.addEventListener("input",draw)); draw();
};
