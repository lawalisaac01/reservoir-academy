<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STRATA — The Reservoir Engineering Academy</title>
<style>
:root{
  --ink:#0A1120;          /* subsurface night */
  --rock:#111B2C;         /* panel shale */
  --rock2:#16233A;        /* raised panel */
  --line:#24354F;         /* hairline */
  --text:#E9EEF6;         /* light text */
  --dim:#9AA9BF;          /* muted text */
  --oil:#F2A93B;          /* crude amber accent */
  --oil-deep:#C77E1E;
  --aqua:#57AECB;         /* aquifer blue */
  --gas:#8FD0B8;          /* solution-gas green */
  --bad:#E4756B;
  --sand:#E5D8BC;
  --r:12px;
  --display: "Palatino Linotype", Palatino, "Iowan Old Style", Georgia, serif;
  --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, "Cascadia Mono", Menlo, Consolas, monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
button{font-family:var(--body);cursor:pointer}
a{color:var(--aqua)}
::selection{background:rgba(242,169,59,.35)}

/* ---------- App frame ---------- */
#app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
header.topbar{grid-column:1/-1;position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:14px;
  padding:10px 20px;background:rgba(10,17,32,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;cursor:pointer}
.brand .word{font-family:var(--display);font-size:22px;letter-spacing:.14em;color:var(--sand)}
.brand .sub{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.topbar .spacer{flex:1}
.progress-pill{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--dim)}
.progress-pill .bar{width:140px;height:6px;border-radius:3px;background:var(--rock2);overflow:hidden}
.progress-pill .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--oil-deep),var(--oil));width:0%}
#menuBtn{display:none;background:none;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:6px 10px;font-size:14px}

/* ---------- Strat-column sidebar (signature) ---------- */
nav.strata{border-right:1px solid var(--line);background:linear-gradient(180deg,#0C1424,#0A1120);
  padding:18px 0 40px;position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto}
nav.strata .colhead{padding:0 18px 10px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.stratum{display:flex;align-items:stretch;gap:0;cursor:pointer;position:relative;border:none;background:none;width:100%;text-align:left;color:var(--text)}
.stratum .pipe{width:34px;position:relative;flex:none}
.stratum .pipe::before{content:"";position:absolute;left:16px;top:0;bottom:0;width:2px;background:var(--line)}
.stratum .pipe .node{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;border-radius:50%;
  background:var(--ink);border:2px solid var(--line)}
.stratum.done .pipe .node{background:var(--oil);border-color:var(--oil)}
.stratum.current .pipe .node{border-color:var(--oil);box-shadow:0 0 0 4px rgba(242,169,59,.18)}
.stratum .layer{flex:1;padding:11px 14px 11px 6px;border-bottom:1px solid rgba(36,53,79,.55)}
.stratum:hover .layer{background:rgba(36,53,79,.35)}
.stratum.current .layer{background:rgba(242,169,59,.08)}
.stratum .lt{font-size:13.5px;font-weight:600;line-height:1.3}
.stratum .ld{font-size:11px;color:var(--dim);font-family:var(--mono);margin-top:2px;display:flex;justify-content:space-between;gap:8px}
.stratum .ld .pct{color:var(--oil)}
#drillDepth{padding:14px 18px 0;font-size:11px;color:var(--dim);font-family:var(--mono)}
#drillDepth b{color:var(--oil);font-weight:600}

/* ---------- Main ---------- */
main{padding:34px clamp(18px,4vw,56px) 90px;max-width:1020px;width:100%}
.crumb{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.crumb span{color:var(--oil)}
h1.pagetitle{font-family:var(--display);font-size:clamp(28px,4vw,40px);line-height:1.15;color:var(--sand);font-weight:400;margin-bottom:8px}
.lede{color:var(--dim);font-size:17px;max-width:64ch;margin-bottom:26px}

/* hero */
.hero{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:30px;
  background:
   linear-gradient(180deg, rgba(10,17,32,0) 0%, rgba(10,17,32,.55) 100%),
   repeating-linear-gradient(180deg,#1A2740 0 26px,#152238 26px 44px,#1E2A3C 44px 78px,#121E33 78px 110px);
  padding:clamp(26px,5vw,54px)}
.hero h1{font-family:var(--display);font-weight:400;color:var(--sand);font-size:clamp(30px,5vw,52px);line-height:1.08;max-width:18ch}
.hero p{margin-top:14px;max-width:60ch;color:#C7D2E4}
.hero .cta{margin-top:22px;display:flex;gap:12px;flex-wrap:wrap}
.btn{border-radius:10px;padding:11px 20px;font-size:14.5px;font-weight:600;border:1px solid var(--line);background:var(--rock2);color:var(--text)}
.btn.primary{background:linear-gradient(180deg,var(--oil),var(--oil-deep));border-color:var(--oil-deep);color:#201502}
.btn.primary:hover{filter:brightness(1.06)}
.btn:hover{border-color:var(--oil)}
.btn:focus-visible,.stratum:focus-visible,.opt:focus-visible{outline:2px solid var(--oil);outline-offset:2px}

/* module cards on home */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--rock);padding:18px;cursor:pointer;transition:transform .12s ease,border-color .12s ease}
.card:hover{transform:translateY(-2px);border-color:var(--oil)}
.card .k{font-family:var(--mono);font-size:11px;color:var(--dim);display:flex;justify-content:space-between}
.card h3{font-family:var(--display);font-weight:400;font-size:19px;margin:6px 0 6px;color:var(--sand)}
.card p{font-size:13.5px;color:var(--dim)}
.card .meter{margin-top:12px;height:4px;border-radius:2px;background:var(--rock2);overflow:hidden}
.card .meter i{display:block;height:100%;background:var(--oil);width:0}

/* lesson list */
.lesson-list{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.lrow{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--rock);border-radius:10px;padding:14px 16px;cursor:pointer}
.lrow:hover{border-color:var(--oil)}
.lrow .idx{font-family:var(--mono);color:var(--dim);font-size:12px;width:38px;flex:none}
.lrow .t{flex:1;font-weight:600;font-size:15px}
.lrow .tag{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--gas);border-radius:20px;padding:2px 10px}
.lrow .tag.quiz{background:var(--aqua)}
.lrow .tag.lab{background:var(--oil)}
.lrow .tick{color:var(--oil);font-size:16px;width:20px;text-align:center}

/* ---------- Lesson content ---------- */
article.lesson{max-width:760px}
article.lesson h3{font-family:var(--display);font-weight:400;color:var(--sand);font-size:24px;margin:34px 0 10px;padding-top:10px;border-top:1px solid var(--line)}
article.lesson h3:first-child{margin-top:6px;border-top:none;padding-top:0}
article.lesson p{margin:12px 0;color:#D6DEEC}
article.lesson ul,article.lesson ol{margin:12px 0 12px 22px;color:#D6DEEC}
article.lesson li{margin:6px 0}
.keyterm{color:var(--oil);font-weight:600}
em{color:#EDE3CB}
.fx{font-family:var(--mono);font-size:16px;background:var(--rock2);border:1px solid var(--line);border-left:3px solid var(--oil);
  border-radius:8px;padding:14px 18px;margin:16px 0;overflow-x:auto;white-space:nowrap;color:#F4E9D0}
.fx .lbl{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:6px;white-space:normal;font-family:var(--body)}
.fx sub,.fx sup{font-size:11px}
.frac{display:inline-flex;flex-direction:column;text-align:center;vertical-align:middle;margin:0 3px}
.frac>span{padding:0 6px}
.frac>span:first-child{border-bottom:1px solid #F4E9D0}
.vars{font-size:13.5px;color:var(--dim);border-left:2px solid var(--line);padding:4px 0 4px 14px;margin:10px 0 18px}
.vars b{color:var(--text);font-family:var(--mono);font-weight:600}
.callout{border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin:18px 0;background:linear-gradient(180deg,rgba(87,174,203,.08),rgba(87,174,203,.02))}
.callout.oil{background:linear-gradient(180deg,rgba(242,169,59,.09),rgba(242,169,59,.02))}
.callout .ct{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--aqua);margin-bottom:6px}
.callout.oil .ct{color:var(--oil)}
.callout p{margin:4px 0;font-size:14.5px}
.example{border:1px solid var(--line);border-radius:var(--r);margin:20px 0;overflow:hidden}
.example .xh{background:var(--rock2);padding:11px 18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--sand)}
.example .xb{padding:14px 18px}
.example .xb p{font-size:15px}
details.step{border:1px solid var(--line);border-radius:8px;margin:8px 0;background:var(--rock)}
details.step summary{padding:10px 14px;cursor:pointer;font-weight:600;font-size:14px;color:var(--aqua);list-style:none}
details.step summary::before{content:"▸ ";color:var(--oil)}
details.step[open] summary::before{content:"▾ "}
details.step .sb{padding:2px 16px 14px;font-size:14.5px}
table.data{border-collapse:collapse;margin:14px 0;font-family:var(--mono);font-size:13px;width:auto}
table.data th,table.data td{border:1px solid var(--line);padding:7px 12px;text-align:right}
table.data th{background:var(--rock2);color:var(--sand);font-weight:600;text-align:center}
table.data td:first-child{text-align:left}

/* ---------- Interactive labs ---------- */
.lab{border:1px solid var(--oil-deep);border-radius:var(--r);margin:24px 0;background:var(--rock);overflow:hidden}
.lab .lh{display:flex;align-items:center;gap:10px;background:linear-gradient(90deg,rgba(242,169,59,.16),transparent);padding:12px 18px;border-bottom:1px solid var(--line)}
.lab .lh .dot{width:8px;height:8px;border-radius:50%;background:var(--oil);box-shadow:0 0 8px var(--oil)}
.lab .lh b{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--sand)}
.lab .body{padding:16px 18px;display:grid;gap:16px}
.lab canvas{width:100%;height:auto;background:#0C1526;border:1px solid var(--line);border-radius:8px;display:block}
.ctrl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px 18px}
.ctrl label{font-size:12.5px;color:var(--dim);display:block}
.ctrl label b{color:var(--text);font-family:var(--mono);font-weight:600}
.ctrl input[type=range]{width:100%;accent-color:var(--oil)}
.ctrl input[type=number]{width:100%;background:var(--ink);border:1px solid var(--line);color:var(--text);border-radius:6px;padding:7px 9px;font-family:var(--mono);font-size:14px}
.readout{display:flex;flex-wrap:wrap;gap:10px}
.readout .chip{background:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:13px}
.readout .chip b{color:var(--oil);font-size:15px}
.readout .chip span{color:var(--dim);font-size:11px;display:block}

/* ---------- Quiz ---------- */
.quiz{margin-top:10px}
.q{border:1px solid var(--line);border-radius:var(--r);background:var(--rock);padding:18px;margin:14px 0}
.q .qt{font-weight:600;margin-bottom:12px}
.opt{display:block;width:100%;text-align:left;background:var(--ink);border:1px solid var(--line);color:var(--text);
  border-radius:8px;padding:10px 14px;margin:7px 0;font-size:14.5px}
.opt:hover{border-color:var(--aqua)}
.opt.correct{border-color:var(--gas);background:rgba(143,208,184,.12)}
.opt.wrong{border-color:var(--bad);background:rgba(228,117,107,.10)}
.why{display:none;font-size:13.5px;color:var(--dim);border-left:2px solid var(--gas);padding-left:12px;margin-top:10px}
.q.answered .why{display:block}
.quiz-score{border:1px solid var(--oil-deep);border-radius:var(--r);padding:18px;margin-top:18px;background:rgba(242,169,59,.06);display:none}
.quiz-score b{color:var(--oil);font-size:20px;font-family:var(--mono)}

/* nav footer */
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:44px;border-top:1px solid var(--line);padding-top:20px;max-width:760px}
.lesson-nav .btn{max-width:48%}
.done-btn{margin-top:30px}

@media (max-width:900px){
  #app{grid-template-columns:1fr}
  nav.strata{position:fixed;left:0;top:53px;bottom:0;width:290px;transform:translateX(-100%);transition:transform .2s ease;z-index:40;box-shadow:0 0 40px rgba(0,0,0,.5)}
  nav.strata.open{transform:none}
  #menuBtn{display:block}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto}}
</style>

<body>
<div id="app">
  <header class="topbar">
    <button id="menuBtn" aria-label="Open course menu">☰ Course</button>
    <div class="brand" onclick="go('home')" tabindex="0" role="button" aria-label="Go home">
      <span class="word">STRATA</span><span class="sub">Reservoir Engineering Academy</span>
    </div>
    <div class="spacer"></div>
    <div class="progress-pill"><span id="pctTxt">0%</span><div class="bar"><i id="pctBar"></i></div></div>
  </header>
  <nav class="strata" id="sidebar" aria-label="Course modules">
    <div class="colhead">Stratigraphic column · drill down as you learn</div>
    <div id="navList"></div>
    <div id="drillDepth"></div>
  </nav>
  <main id="main" tabindex="-1"></main>
</div>
<script>
"use strict";
const COURSE = [];
</script>
<script>
/* =================== MODULES 1–3 =================== */
COURSE.push({
id:"m1", num:"01", title:"Orientation: The Reservoir Engineer's World", depth:"0 – 250 m",
tag:"Foundations",
blurb:"What the discipline is, the recovery ladder, reservoir types, and the natural energies that push hydrocarbons to your wells.",
lessons:[
{title:"The job: managing a tank you will never see", type:"read", html:`
<h3>A tank buried under kilometres of rock</h3>
<p>A petroleum reservoir is a body of porous, permeable rock — sandstone or carbonate — whose microscopic pore spaces hold oil, gas and water under enormous pressure, sealed beneath an impermeable cap rock. You will never see it. Every decision you make about it is inferred from <span class="keyterm">pressure measurements</span>, <span class="keyterm">rock and fluid samples</span>, <span class="keyterm">production data</span> and <span class="keyterm">well logs</span>.</p>
<p><span class="keyterm">Reservoir engineering</span> is the art of using physics, chemistry, mathematics and economics to answer three questions:</p>
<ol>
<li><em>How much hydrocarbon is there?</em> — volumetric estimation, material balance.</li>
<li><em>How fast can it be produced?</em> — fluid flow, well deliverability, well testing.</li>
<li><em>How much can ultimately be recovered, and how do we maximise it?</em> — drive mechanisms, decline analysis, performance prediction, secondary and enhanced recovery.</li>
</ol>
<div class="callout oil"><div class="ct">Why it matters</div><p>Primary recovery alone typically leaves 70–90% of the oil behind. The difference between a well-managed and a poorly managed reservoir is measured in hundreds of millions of barrels. Reservoir engineering is the discipline of not leaving them behind carelessly.</p></div>
<h3>The recovery ladder</h3>
<ul>
<li><b>Primary recovery</b> — production using only the reservoir's natural energy (fluid and rock expansion, solution gas, gas cap, aquifer water, gravity). Typical recovery: 5–30% of oil in place.</li>
<li><b>Secondary recovery</b> — energy is added by injecting water or gas to maintain pressure and sweep oil. Adds roughly 10–20%.</li>
<li><b>Tertiary / Enhanced Oil Recovery (EOR)</b> — the physics of displacement itself is altered: thermal (steam), chemical (polymer, surfactant), miscible gas (CO₂), microbial.</li>
</ul>
<h3>The data you live on</h3>
<p>Everything in this academy rests on four data streams: <b>core analysis</b> (porosity, permeability, saturations, capillary pressure), <b>PVT laboratory analysis</b> (how fluids expand, shrink and release gas), <b>well tests</b> (pressure vs. time → permeability, skin, boundaries), and <b>production history</b> (rates and pressures → material balance, decline curves). Each module of this course teaches you to turn one of these streams into decisions.</p>
`},
{title:"Reservoir types & natural drive mechanisms", type:"read", html:`
<h3>Classifying reservoirs by initial pressure</h3>
<p>Compare the initial reservoir pressure p<sub>i</sub> with the fluid's <span class="keyterm">bubble-point pressure</span> p<sub>b</sub> (the pressure at which the first bubble of gas comes out of solution):</p>
<ul>
<li><b>Undersaturated oil reservoir</b>: p<sub>i</sub> &gt; p<sub>b</sub>. All gas remains dissolved; the reservoir is single-phase liquid.</li>
<li><b>Saturated oil reservoir</b>: p<sub>i</sub> ≤ p<sub>b</sub>. Free gas exists — if it has segregated upward, the reservoir has a <span class="keyterm">gas cap</span>.</li>
<li><b>Gas reservoirs</b>: dry gas, wet gas, or retrograde gas-condensate (Module 4 explains these with the phase diagram).</li>
</ul>
<h3>The six natural drive mechanisms</h3>
<p>A reservoir produces because <em>something expands</em> as pressure falls. That something defines the drive mechanism, and the drive mechanism defines the recovery factor.</p>
<table class="data"><tr><th>Drive</th><th>Energy source</th><th>Pressure behaviour</th><th>GOR behaviour</th><th>Typical RF (oil)</th></tr>
<tr><td>Rock &amp; liquid expansion</td><td>Compressibility of oil, water, pores (above p<sub>b</sub>)</td><td>Declines rapidly</td><td>Constant (= R<sub>si</sub>)</td><td>1–5%</td></tr>
<tr><td>Solution-gas (depletion) drive</td><td>Gas liberated from oil below p<sub>b</sub></td><td>Declines rapidly &amp; continuously</td><td>Rises to a peak, then falls</td><td>5–30%</td></tr>
<tr><td>Gas-cap drive</td><td>Expansion of free gas cap</td><td>Falls slowly, steadily</td><td>Rises continuously in up-dip wells</td><td>20–40%</td></tr>
<tr><td>Water drive</td><td>Aquifer expansion &amp; influx</td><td>Remains high</td><td>Nearly constant</td><td>35–75%</td></tr>
<tr><td>Gravity drainage</td><td>Density segregation in steep, thick, permeable sands</td><td>Varies</td><td>Low in down-dip wells</td><td>up to 60–80%</td></tr>
<tr><td>Combination</td><td>Two or more of the above</td><td>Intermediate</td><td>Intermediate</td><td>varies</td></tr></table>
<div class="callout"><div class="ct">Diagnostic instinct</div><p>Pressure history + GOR history + water cut history together fingerprint the drive mechanism. A reservoir whose pressure barely falls while water cut climbs is water-driven; one whose GOR spikes while pressure crashes is on solution-gas drive. Module 7's drive indices make this quantitative.</p></div>
<h3>Reservoir management in one sentence</h3>
<p>Identify the dominant energy early, then produce the field in a way that conserves and supplements that energy — e.g. keep pressure above p<sub>b</sub> to avoid wasteful free-gas mobility, shut in high-GOR up-dip wells in gas-cap drive, balance offtake against aquifer strength in water drive.</p>
`},
{title:"Checkpoint · Module 1", type:"quiz", quiz:[
{q:"A reservoir's initial pressure is 4,200 psia and its bubble-point is 2,900 psia. The reservoir is…",opts:["Saturated, with a gas cap","Undersaturated single-phase oil","A retrograde condensate","At its dew point"],a:1,why:"p_i > p_b means all gas is still in solution — an undersaturated oil reservoir."},
{q:"Which drive mechanism typically gives the highest primary recovery factor?",opts:["Rock & liquid expansion","Solution-gas drive","Strong water drive","None — all are equal"],a:2,why:"Aquifer influx maintains pressure and sweeps oil: 35–75% RF, versus 1–5% for pure expansion drive."},
{q:"In a solution-gas drive reservoir, the producing GOR typically…",opts:["Stays constant for the whole life","Falls continuously","Rises to a maximum then declines","Equals zero below bubble point"],a:2,why:"Below p_b free gas becomes mobile and GOR climbs; late in life the depleted reservoir has little gas left to expand, so GOR falls."},
{q:"Secondary recovery is best described as…",opts:["Producing with natural energy only","Injecting water or gas to add reservoir energy","Changing the displacement physics with chemicals or heat","Drilling infill wells"],a:1,why:"Secondary recovery supplements natural energy by injection; EOR (tertiary) changes the displacement physics itself."},
{q:"The strongest early fingerprint of a water-drive reservoir is…",opts:["Rapidly crashing pressure and spiking GOR","Nearly flat pressure with rising water cut","Constant GOR and constant water cut forever","Very high initial GOR"],a:1,why:"Aquifer support holds pressure nearly constant while the advancing water raises water cut."}
]}
]});

COURSE.push({
id:"m2", num:"02", title:"Pressure Regimes & Fluid Contacts", depth:"250 – 600 m",
tag:"Foundations",
blurb:"Hydrostatic gradients, overpressure, and how a handful of RFT pressure points pins down the gas–oil and oil–water contacts.",
lessons:[
{title:"Pressure gradients and abnormal pressure", type:"read", html:`
<h3>The hydrostatic backbone</h3>
<p>In a normally pressured basin, pore pressure at any depth equals the weight of a continuous column of formation water from surface:</p>
<div class="fx"><span class="lbl">Hydrostatic pore pressure</span>p = G<sub>w</sub> · D + 14.7 &nbsp;&nbsp;(psia)</div>
<div class="vars"><b>G<sub>w</sub></b> ≈ 0.433 psi/ft for fresh water, ≈ <b>0.465 psi/ft</b> for typical saline formation water · <b>D</b> = depth, ft</div>
<p>Each fluid, being of different density, imposes its own gradient inside the reservoir:</p>
<table class="data"><tr><th>Fluid</th><th>Typical gradient (psi/ft)</th></tr>
<tr><td>Formation water</td><td>0.45 – 0.50</td></tr>
<tr><td>Oil</td><td>0.30 – 0.40 (≈0.35)</td></tr>
<tr><td>Gas</td><td>0.05 – 0.12 (≈0.08)</td></tr></table>
<h3>Overpressure and underpressure</h3>
<p>If the pore fluid is sealed and cannot communicate with surface — rapid burial with no dewatering, uplift, charged by deeper zones — pressure departs from hydrostatic. We write:</p>
<div class="fx">p = 0.465 · D + 14.7 + C</div>
<p>where <b>C</b> &gt; 0 indicates <span class="keyterm">overpressure</span> (drilling hazard: kicks, blowouts) and <b>C</b> &lt; 0 <span class="keyterm">underpressure</span> (lost-circulation risk). The <span class="keyterm">overburden gradient</span> (total rock + fluid weight) is ≈ 1 psi/ft; pore pressure plus grain-to-grain stress must always carry the overburden.</p>
<div class="callout"><div class="ct">Field habit</div><p>Always convert gauge readings to a common <em>datum depth</em> (usually mid-perforations or the initial OWC) before comparing well pressures — otherwise you are comparing apples at different elevations.</p></div>
`},
{title:"Locating fluid contacts from pressure surveys", type:"read", html:`
<h3>Straight lines that find contacts</h3>
<p>Run a formation tester (RFT/MDT) down a well: in the gas leg the points fall on a line of slope ≈0.08 psi/ft, in the oil leg ≈0.35 psi/ft, in the water leg ≈0.465 psi/ft. <em>Where two lines intersect is the fluid contact.</em> This is how the <span class="keyterm">gas–oil contact (GOC)</span> and <span class="keyterm">oil–water contact (OWC)</span> are fixed before a single drop is produced.</p>
<p>Write each fluid's pressure line from a known point and equate:</p>
<div class="fx"><span class="lbl">Contact depth from two gradient lines</span>p<sub>oil</sub>(D) = p<sub>gas</sub>(D)  →  D<sub>GOC</sub> = <span class="frac"><span>(p<sub>o,ref</sub> − G<sub>o</sub>D<sub>o,ref</sub>) − (p<sub>g,ref</sub> − G<sub>g</sub>D<sub>g,ref</sub>)</span><span>G<sub>g</sub> − G<sub>o</sub></span></span></div>
<div class="example"><div class="xh">Worked example — where is the OWC?</div><div class="xb">
<p>An appraisal well measures oil pressure 3,220 psia at 7,000 ft. A water-leg point in a nearby well reads 3,344 psia at 7,320 ft. G<sub>o</sub>=0.35, G<sub>w</sub>=0.465 psi/ft.</p>
<details class="step"><summary>Step 1 — Write the two lines</summary><div class="sb">Oil: p = 3220 + 0.35(D − 7000). Water: p = 3344 + 0.465(D − 7320).</div></details>
<details class="step"><summary>Step 2 — Equate and solve</summary><div class="sb">3220 + 0.35D − 2450 = 3344 + 0.465D − 3403.8 → 770 + 0.35D = −59.8 + 0.465D → 0.115D = 829.8 → <b>D = 7,215 ft</b>.</div></details>
<details class="step"><summary>Step 3 — Sanity check</summary><div class="sb">7,215 ft lies below the oil point (7,000 ft) and above the water point (7,320 ft). ✓ The OWC is at ≈7,215 ft.</div></details>
</div></div>
<div class="lab" data-widget="contacts"><div class="lh"><span class="dot"></span><b>Lab · Contact Finder</b></div>
<div class="body"><p style="font-size:13.5px;color:var(--dim);margin:0">Drag the gradients and reference pressures. Watch the GOC and OWC move — this is exactly the graphical construction used on RFT plots.</p>
<div class="ctrl">
<label>Gas gradient <b data-out="gg"></b> psi/ft<input type="range" min="0.05" max="0.12" step="0.005" value="0.08" data-in="gg"></label>
<label>Oil gradient <b data-out="go"></b> psi/ft<input type="range" min="0.28" max="0.42" step="0.005" value="0.35" data-in="go"></label>
<label>Water gradient <b data-out="gw"></b> psi/ft<input type="range" min="0.433" max="0.50" step="0.002" value="0.465" data-in="gw"></label>
<label>Oil pressure @ 7,000 ft <b data-out="po"></b> psia<input type="range" min="3150" max="3300" step="5" value="3220" data-in="po"></label>
</div>
<canvas width="720" height="420"></canvas>
<div class="readout"><div class="chip"><span>Gas–oil contact</span><b data-out="goc"></b></div><div class="chip"><span>Oil–water contact</span><b data-out="owc"></b></div></div>
</div></div>
<div class="callout oil"><div class="ct">Curiosity</div><p>A “tilted” or inconsistent contact between wells is a red flag: it may reveal <em>separate fault compartments</em>, each with its own pressure system — one of the cheapest pieces of reservoir-architecture intelligence you will ever get.</p></div>
`},
{title:"Checkpoint · Module 2", type:"quiz", quiz:[
{q:"Typical pressure gradients (psi/ft) for water, oil and gas are approximately…",opts:["0.465 / 0.35 / 0.08","0.35 / 0.465 / 0.08","0.08 / 0.35 / 0.465","1.0 / 0.465 / 0.35"],a:0,why:"Denser fluids impose steeper gradients: water ≈0.465, oil ≈0.35, gas ≈0.08 psi/ft."},
{q:"A zone at 9,000 ft reads 5,600 psia. Hydrostatic (0.465 psi/ft) predicts ≈4,200 psia. The zone is…",opts:["Normally pressured","Underpressured","Overpressured by ≈1,400 psi","Impossible to say"],a:2,why:"Measured minus hydrostatic = 5,600 − 4,200 ≈ +1,400 psi: strongly overpressured — a drilling hazard."},
{q:"On a pressure–depth plot, the OWC is found where…",opts:["The oil line crosses zero","The oil-gradient line intersects the water-gradient line","Pressure equals overburden","The gas line becomes vertical"],a:1,why:"Each fluid defines a straight line; contacts are the intersections."},
{q:"Two wells in the same sand show water lines offset by 300 psi at the same datum. Most likely explanation:",opts:["Instrument error is the only possibility","The sand is sealed into separate fault compartments","Gas gradient was used by mistake","The wells share one aquifer"],a:1,why:"Different pressure systems at a common datum imply no pressure communication — compartmentalisation."},
{q:"The overburden gradient in a normally compacted basin is about…",opts:["0.465 psi/ft","0.35 psi/ft","1.0 psi/ft","3.2 psi/ft"],a:2,why:"Total rock+fluid column weighs ≈1 psi/ft; pore pressure + matrix stress = overburden."}
]}
]});

COURSE.push({
id:"m3", num:"03", title:"Reservoir Rock Properties", depth:"600 – 1,100 m",
tag:"Rock physics",
blurb:"Porosity, saturation, Darcy's law, permeability averaging, wettability, relative permeability and capillary pressure — the rock half of the story.",
lessons:[
{title:"Porosity, saturation & rock compressibility", type:"read", html:`
<h3>Porosity — the storage</h3>
<div class="fx"><span class="lbl">Porosity</span>φ = <span class="frac"><span>pore volume, V<sub>p</sub></span><span>bulk volume, V<sub>b</sub></span></span> = <span class="frac"><span>V<sub>b</sub> − V<sub>gr</sub></span><span>V<sub>b</sub></span></span></div>
<p><span class="keyterm">Total porosity</span> counts all pores; <span class="keyterm">effective porosity</span> counts only interconnected pores — the only ones that matter for flow. <span class="keyterm">Primary</span> porosity is depositional (intergranular); <span class="keyterm">secondary</span> porosity forms afterwards (fractures, vugs, dissolution). Typical sandstones: 10–35%. Porosity is measured on core (Boyle's-law porosimeter, saturation methods) and from logs (density, neutron, sonic).</p>
<p>Averaging across a field must be weighted by the volume each sample represents:</p>
<div class="fx"><span class="lbl">Thickness- (and area-) weighted average</span>φ̄ = Σ(φ<sub>i</sub> h<sub>i</sub>) / Σh<sub>i</sub></div>
<h3>Fluid saturation — who occupies the pores</h3>
<div class="fx">S<sub>o</sub> + S<sub>w</sub> + S<sub>g</sub> = 1,&nbsp;&nbsp; S<sub>x</sub> = V<sub>x</sub>/V<sub>p</sub></div>
<p>Even the cleanest oil zone retains <span class="keyterm">connate (irreducible) water saturation</span> S<sub>wc</sub> ≈ 10–40%, trapped by capillary forces on grain surfaces. After waterflooding, a <span class="keyterm">residual oil saturation</span> S<sub>or</sub> ≈ 20–35% is left as disconnected blobs. Movable oil is bounded by these two numbers.</p>
<h3>Rock (pore-volume) compressibility</h3>
<div class="fx"><span class="lbl">Formation compressibility</span>c<sub>f</sub> = <span class="frac"><span>1</span><span>V<sub>p</sub></span></span>·<span class="frac"><span>∂V<sub>p</sub></span><span>∂p</span></span> &nbsp;&nbsp;(typically 3–10 ×10<sup>−6</sup> psi<sup>−1</sup>)</div>
<p>As pore pressure falls, the overburden squeezes pores smaller — a real drive energy, dominant above the bubble point, and central to the material balance's E<sub>f,w</sub> term (Module 7). The <b>total compressibility</b> used throughout well testing is:</p>
<div class="fx">c<sub>t</sub> = c<sub>o</sub>S<sub>o</sub> + c<sub>w</sub>S<sub>w</sub> + c<sub>g</sub>S<sub>g</sub> + c<sub>f</sub></div>
`},
{title:"Permeability & Darcy's law", type:"read", html:`
<h3>Darcy's experiment, generalised</h3>
<p><span class="keyterm">Permeability k</span> is the rock's conductivity to fluid — a property of the rock alone (for single-phase flow). Henry Darcy (1856, water filters of Dijon) found flow rate proportional to pressure gradient and inversely proportional to viscosity:</p>
<div class="fx"><span class="lbl">Darcy's law — linear, incompressible, horizontal</span>q = <span class="frac"><span>k A Δp</span><span>μ L</span></span>&nbsp;&nbsp;(Darcy units)&nbsp;&nbsp;→&nbsp;&nbsp;q = <span class="frac"><span>1.127×10<sup>−3</sup> k A Δp</span><span>μ L</span></span>&nbsp;(field units)</div>
<div class="vars"><b>q</b> bbl/d · <b>k</b> md · <b>A</b> ft² · <b>Δp</b> psi · <b>μ</b> cp · <b>L</b> ft. 1 darcy = 1000 md ≈ 9.87×10<sup>−9</sup> cm².</div>
<p>For <b>radial steady-state</b> flow into a well — the geometry of almost everything we do:</p>
<div class="fx"><span class="lbl">Radial incompressible flow (field units)</span>q = <span class="frac"><span>0.00708 k h (p<sub>e</sub> − p<sub>wf</sub>)</span><span>μ B ln(r<sub>e</sub>/r<sub>w</sub>)</span></span></div>
<p>For <b>compressible gas</b>, rate varies along the path; using the real-gas law and expressing rate at standard conditions gives the pressure-squared form:</p>
<div class="fx"><span class="lbl">Radial gas flow (p² form)</span>q<sub>g</sub> = <span class="frac"><span>k h (p<sub>e</sub>² − p<sub>wf</sub>²)</span><span>1422 T z̄ μ̄ ln(r<sub>e</sub>/r<sub>w</sub>)</span></span>&nbsp;&nbsp;Mscf/d</div>
<div class="callout"><div class="ct">Klinkenberg effect</div><p>Gas measured permeability exceeds liquid permeability at low pressure because gas molecules “slip” along pore walls. Lab gas permeabilities are corrected by plotting k<sub>g</sub> vs 1/p̄ and extrapolating to infinite pressure: k<sub>L</sub> = k<sub>g</sub>/(1 + b/p̄).</p></div>
<div class="lab" data-widget="darcy"><div class="lh"><span class="dot"></span><b>Lab · Radial Inflow Calculator</b></div>
<div class="body"><div class="ctrl">
<label>k (md)<input type="number" value="120" data-in="k"></label>
<label>h (ft)<input type="number" value="40" data-in="h"></label>
<label>p<sub>e</sub> (psia)<input type="number" value="3600" data-in="pe"></label>
<label>p<sub>wf</sub> (psia)<input type="number" value="2400" data-in="pwf"></label>
<label>μ (cp)<input type="number" value="1.4" step="0.1" data-in="mu"></label>
<label>B<sub>o</sub> (rb/stb)<input type="number" value="1.25" step="0.01" data-in="bo"></label>
<label>r<sub>e</sub> (ft)<input type="number" value="1500" data-in="re"></label>
<label>r<sub>w</sub> (ft)<input type="number" value="0.35" step="0.01" data-in="rw"></label>
</div>
<div class="readout"><div class="chip"><span>Steady-state oil rate</span><b data-out="q"></b></div><div class="chip"><span>Productivity index J</span><b data-out="j"></b></div></div>
<p style="font-size:12.5px;color:var(--dim);margin:0">Notice the logarithm: doubling r<sub>e</sub> barely changes q, but doubling k doubles it. Half the total pressure drop occurs within a few tens of feet of the wellbore — which is why near-wellbore damage (skin) is so punishing.</p>
</div></div>
`},
{title:"Averaging permeability & relative permeability", type:"read", html:`
<h3>Averaging k — geometry decides the mean</h3>
<p><b>Parallel beds</b> (flow along layers, same Δp): thickness-weighted <em>arithmetic</em> average —</p>
<div class="fx">k̄ = Σ(k<sub>i</sub>h<sub>i</sub>) / Σh<sub>i</sub></div>
<p><b>Series beds</b> (flow through layers in sequence, same q): <em>harmonic</em> average —</p>
<div class="fx">k̄ = ΣL<sub>i</sub> / Σ(L<sub>i</sub>/k<sub>i</sub>) &nbsp;&nbsp;(radial series: k̄ = ln(r<sub>e</sub>/r<sub>w</sub>) / Σ[ln(r<sub>i</sub>/r<sub>i−1</sub>)/k<sub>i</sub>])</div>
<p><b>Random heterogeneity</b>: the <em>geometric</em> mean k̄ = (k₁k₂…k<sub>n</sub>)<sup>1/n</sup>. Rule: harmonic ≤ geometric ≤ arithmetic. A thin tight streak in series wrecks flow; in parallel it is barely noticed.</p>
<h3>When two fluids share the pores</h3>
<p>Each phase then flows through only part of the pore network. Define <span class="keyterm">effective permeability</span> k<sub>o</sub>, k<sub>w</sub>, k<sub>g</sub> (functions of saturation) and <span class="keyterm">relative permeability</span>:</p>
<div class="fx">k<sub>ro</sub> = k<sub>o</sub>/k, &nbsp; k<sub>rw</sub> = k<sub>w</sub>/k, &nbsp; 0 ≤ k<sub>r</sub> ≤ 1, &nbsp; k<sub>ro</sub>+k<sub>rw</sub> &lt; 1</div>
<p>Key features of the water–oil curves: k<sub>rw</sub>=0 below S<sub>wc</sub>; k<sub>ro</sub>=0 at 1−S<sub>or</sub>; the crossover saturation (k<sub>ro</sub>=k<sub>rw</sub>) sits above S<sub>w</sub>=0.5 for water-wet rock and below it for oil-wet rock. <span class="keyterm">Wettability</span> — which fluid preferentially coats the grains — controls the shapes: water-wet rock holds water in small pores and corners, letting oil flow efficiently; oil-wet rock does the opposite and waterfloods poorly.</p>
<p>Smooth laboratory curves are usually modelled with <b>Corey</b> functions of normalised saturation S<sub>wn</sub> = (S<sub>w</sub>−S<sub>wc</sub>)/(1−S<sub>wc</sub>−S<sub>or</sub>):</p>
<div class="fx">k<sub>rw</sub> = k<sub>rw</sub>° · S<sub>wn</sub><sup>n<sub>w</sub></sup>, &nbsp;&nbsp; k<sub>ro</sub> = k<sub>ro</sub>° · (1−S<sub>wn</sub>)<sup>n<sub>o</sub></sup></div>
<div class="lab" data-widget="relperm"><div class="lh"><span class="dot"></span><b>Lab · Relative Permeability Explorer</b></div>
<div class="body"><div class="ctrl">
<label>S<sub>wc</sub> <b data-out="swc"></b><input type="range" min="0.05" max="0.4" step="0.01" value="0.20" data-in="swc"></label>
<label>S<sub>or</sub> <b data-out="sor"></b><input type="range" min="0.1" max="0.4" step="0.01" value="0.25" data-in="sor"></label>
<label>n<sub>w</sub> (water Corey exp.) <b data-out="nw"></b><input type="range" min="1" max="6" step="0.1" value="3" data-in="nw"></label>
<label>n<sub>o</sub> (oil Corey exp.) <b data-out="no"></b><input type="range" min="1" max="6" step="0.1" value="2" data-in="no"></label>
<label>k<sub>rw</sub>° endpoint <b data-out="krwe"></b><input type="range" min="0.1" max="1" step="0.02" value="0.4" data-in="krwe"></label>
</div>
<canvas width="720" height="420"></canvas>
<p style="font-size:12.5px;color:var(--dim);margin:0">Raise k<sub>rw</sub>° toward 1 and drop the crossover below S<sub>w</sub>=0.5 — you have just made the rock oil-wet, and you can feel why its waterflood will be leaky and early to break through.</p>
</div></div>
`},
{title:"Capillary pressure & the transition zone", type:"read", html:`
<h3>Pressure discontinuity at every meniscus</h3>
<p>Where two immiscible fluids meet in a pore throat, interfacial tension curves the interface and supports a pressure difference — the <span class="keyterm">capillary pressure</span>:</p>
<div class="fx"><span class="lbl">Capillary tube model</span>P<sub>c</sub> = p<sub>non-wetting</sub> − p<sub>wetting</sub> = <span class="frac"><span>2 σ cos θ</span><span>r</span></span></div>
<div class="vars"><b>σ</b> interfacial tension · <b>θ</b> contact angle (θ&lt;90° water-wet) · <b>r</b> pore-throat radius. Small pores → huge P<sub>c</sub>.</div>
<p>In the reservoir, P<sub>c</sub> at height h above the <span class="keyterm">free-water level (FWL)</span> is set by the density difference:</p>
<div class="fx">P<sub>c</sub>(h) = <span class="frac"><span>(ρ<sub>w</sub> − ρ<sub>o</sub>) h</span><span>144</span></span> &nbsp;psi&nbsp;&nbsp;(ρ in lb/ft³, h in ft)</div>
<p>Invert the lab P<sub>c</sub>(S<sub>w</sub>) curve with this relation and you get the <b>saturation–height function</b>: the <span class="keyterm">transition zone</span> over which S<sub>w</sub> falls from 100% at the FWL to S<sub>wc</sub> high above it. Tight, small-pored rock → tall transition zones (hundreds of feet possible); high-k rock → sharp contacts. Note the OWC (lowest depth producing oil) sits <em>above</em> the FWL by the displacement (entry) pressure P<sub>d</sub>.</p>
<p>Key P<sub>c</sub> concepts: <b>displacement pressure</b> P<sub>d</sub> (minimum P<sub>c</sub> for the non-wetting phase to enter the largest pores — also what makes cap rocks seal), <b>drainage vs imbibition hysteresis</b>, and the <b>Leverett J-function</b> that lets one dimensionless curve represent many core plugs:</p>
<div class="fx">J(S<sub>w</sub>) = 0.21645 · <span class="frac"><span>P<sub>c</sub></span><span>σ cos θ</span></span> · √(k/φ)</div>
<div class="example"><div class="xh">Worked example — height of the transition zone</div><div class="xb">
<p>Lab air–mercury data converted to reservoir oil–water gives P<sub>c</sub> = 9 psi at S<sub>w</sub>=50%. ρ<sub>w</sub>=68, ρ<sub>o</sub>=48 lb/ft³. At what height above the FWL is S<sub>w</sub>=50%?</p>
<details class="step"><summary>Solution</summary><div class="sb">h = 144·P<sub>c</sub>/(ρ<sub>w</sub>−ρ<sub>o</sub>) = 144×9/20 = <b>64.8 ft</b>. Wells perforated within ~65 ft of the FWL will make water from day one — plan perforations accordingly.</div></details>
</div></div>
`},
{title:"Checkpoint · Module 3", type:"quiz", quiz:[
{q:"Effective porosity differs from total porosity because it excludes…",opts:["Fracture porosity","Isolated, unconnected pores","Water-filled pores","Vugs"],a:1,why:"Only interconnected pore volume can flow fluids; isolated pores store but never deliver."},
{q:"Flow crosses three beds in series (equal length) with k = 200, 50 and 5 md. The average is closest to…",opts:["85 md (arithmetic)","13.6 md (harmonic)","37 md (geometric)","255 md"],a:1,why:"Series flow → harmonic mean = 3/(1/200+1/50+1/5) ≈ 13.3–13.6 md. The 5-md streak dominates."},
{q:"In strongly water-wet rock, the krw–kro crossover occurs at…",opts:["Sw < 0.5","Sw > 0.5","Exactly Sw = 0.5","Swc"],a:1,why:"Water clings to grain surfaces and small pores, suppressing krw; the curves cross above 50% water saturation."},
{q:"Capillary pressure in a pore throat increases when…",opts:["Pore radius increases","Interfacial tension decreases","Pore radius decreases","Contact angle goes to 90°"],a:2,why:"Pc = 2σcosθ/r — smaller throats hold larger capillary pressures."},
{q:"Total compressibility ct is…",opts:["cf only","co+cw+cg","coSo + cwSw + cgSg + cf","The gas compressibility at pb"],a:2,why:"Each fluid weighted by its saturation, plus the pore-volume compressibility."},
{q:"The Klinkenberg correction addresses…",opts:["Turbulence at high rates","Gas slippage at low pressure inflating measured k","Core drying damage","Overburden stress on plugs"],a:1,why:"Gas slip along pore walls makes kg > kL; extrapolating kg vs 1/p̄ to 1/p̄→0 recovers the true liquid permeability."}
]}
]});

COURSE.push({
id:"m4", num:"04", title:"Reservoir Fluid Properties", depth:"1,100 – 1,600 m",
tag:"Fluid physics",
blurb:"Phase diagrams, the five reservoir fluids, real-gas behaviour (z, Bg, cg, μg) and black-oil properties (Rs, Bo, Bt, co, μo).",
lessons:[
{title:"Phase behaviour & the five reservoir fluids", type:"read", html:`
<h3>The pressure–temperature phase envelope</h3>
<p>Plot a hydrocarbon mixture on a p–T diagram: the <span class="keyterm">bubble-point curve</span> and <span class="keyterm">dew-point curve</span> meet at the <span class="keyterm">critical point</span> and enclose the two-phase region. Two special points bound the envelope: the <span class="keyterm">cricondentherm</span> (maximum two-phase temperature) and <span class="keyterm">cricondenbar</span> (maximum two-phase pressure). Where the reservoir temperature T<sub>R</sub> sits relative to these features classifies the fluid:</p>
<table class="data"><tr><th>Fluid type</th><th>T<sub>R</sub> vs envelope</th><th>Initial GOR (scf/stb)</th><th>Stock-tank gravity</th><th>Signature</th></tr>
<tr><td>Black oil</td><td>T<sub>R</sub> ≪ T<sub>c</sub></td><td>&lt; ~2,000</td><td>&lt; ~45° API, dark</td><td>Wide envelope; Bo &lt; 2</td></tr>
<tr><td>Volatile oil</td><td>T<sub>R</sub> just below T<sub>c</sub></td><td>2,000–3,300</td><td>&gt; 40° API</td><td>Huge shrinkage; isovols crowded near bubble line</td></tr>
<tr><td>Retrograde gas-condensate</td><td>T<sub>c</sub> &lt; T<sub>R</sub> &lt; cricondentherm</td><td>3,300–150,000</td><td>40–60° API liquid</td><td>Liquid <em>condenses</em> in the reservoir as p falls</td></tr>
<tr><td>Wet gas</td><td>T<sub>R</sub> &gt; cricondentherm</td><td>&gt; 50,000</td><td>condensate at surface only</td><td>Two phases in separator, one in reservoir</td></tr>
<tr><td>Dry gas</td><td>T<sub>R</sub> &gt; cricondentherm</td><td>≈ ∞</td><td>no liquids</td><td>Single phase everywhere</td></tr></table>
<div class="callout oil"><div class="ct">The retrograde paradox</div><p>Drop the pressure of a gas-condensate isothermally and liquid <em>appears</em> — the opposite of everyday intuition. That liquid clings immobile in the pores near wells (condensate banking), choking gas deliverability and stranding the most valuable molecules. This is why condensate fields are often produced with gas <em>recycling</em> above the dew point.</p></div>
<h3>Behaviour on depletion</h3>
<p>An undersaturated black oil produced from p<sub>i</sub> down to p<sub>b</sub> is single phase; below p<sub>b</sub> gas breaks out, oil shrinks, viscosity rises. These changes are captured by the black-oil property set — R<sub>s</sub>, B<sub>o</sub>, B<sub>g</sub>, μ — which the next two lessons build.</p>
`},
{title:"Real-gas behaviour: z, Bg, cg, μg", type:"read", html:`
<h3>The real-gas law</h3>
<div class="fx">pV = z n R T</div>
<p>The <span class="keyterm">z-factor</span> (deviation factor) corrects the ideal-gas law for molecular volume and attraction. By the <span class="keyterm">law of corresponding states</span>, z is a universal function of pseudo-reduced properties:</p>
<div class="fx">T<sub>pr</sub> = T/T<sub>pc</sub>, &nbsp; p<sub>pr</sub> = p/p<sub>pc</sub>; &nbsp;&nbsp;T<sub>pc</sub> = Σy<sub>i</sub>T<sub>ci</sub>, &nbsp;p<sub>pc</sub> = Σy<sub>i</sub>p<sub>ci</sub> (Kay's rule)</div>
<p>Without a composition, Sutton's correlations from gas gravity γ<sub>g</sub> (= M<sub>a</sub>/28.96) work well:</p>
<div class="fx">T<sub>pc</sub> = 169.2 + 349.5γ<sub>g</sub> − 74.0γ<sub>g</sub>² &nbsp;(°R)<br>p<sub>pc</sub> = 756.8 − 131.0γ<sub>g</sub> − 3.6γ<sub>g</sub>² &nbsp;(psia)</div>
<p>z is then read from the Standing–Katz chart — or computed with the Dranchuk–Abou-Kassem (DAK) equation of state, which is exactly what the lab below does. Corrections (Wichert–Aziz) apply when CO₂/H₂S are present.</p>
<h3>Gas formation volume factor, compressibility, viscosity</h3>
<div class="fx"><span class="lbl">Gas FVF (reservoir volume per standard volume)</span>B<sub>g</sub> = 0.02827 <span class="frac"><span>z T</span><span>p</span></span> ft³/scf &nbsp;=&nbsp; 0.00504 <span class="frac"><span>z T</span><span>p</span></span> bbl/scf &nbsp;&nbsp;(T in °R)</div>
<div class="fx"><span class="lbl">Isothermal gas compressibility</span>c<sub>g</sub> = <span class="frac"><span>1</span><span>p</span></span> − <span class="frac"><span>1</span><span>z</span></span>·<span class="frac"><span>∂z</span><span>∂p</span></span> &nbsp;&nbsp;(≈ 1/p for near-ideal gas)</div>
<p>Gas <b>expansion factor</b> E<sub>g</sub> = 1/B<sub>g</sub>. Gas viscosity μ<sub>g</sub> (0.01–0.03 cp) is estimated from the Lee–Gonzalez–Eakin or Carr correlations; unusually, μ<sub>g</sub> <em>increases</em> with pressure and temperature at reservoir conditions.</p>
<div class="lab" data-widget="zfac"><div class="lh"><span class="dot"></span><b>Lab · z-Factor &amp; B<sub>g</sub> Engine (Dranchuk–Abou-Kassem)</b></div>
<div class="body"><div class="ctrl">
<label>Gas gravity γ<sub>g</sub> (air=1)<input type="number" value="0.70" step="0.01" min="0.55" max="1.5" data-in="sg"></label>
<label>Pressure (psia)<input type="number" value="3000" step="50" min="100" data-in="p"></label>
<label>Temperature (°F)<input type="number" value="180" step="5" data-in="t"></label>
</div>
<div class="readout">
<div class="chip"><span>T<sub>pc</sub> / p<sub>pc</sub></span><b data-out="pc"></b></div>
<div class="chip"><span>T<sub>pr</sub> / p<sub>pr</sub></span><b data-out="pr"></b></div>
<div class="chip"><span>z-factor</span><b data-out="z"></b></div>
<div class="chip"><span>B<sub>g</sub></span><b data-out="bg"></b></div>
<div class="chip"><span>E<sub>g</sub> = 1/B<sub>g</sub></span><b data-out="eg"></b></div>
</div>
<canvas width="720" height="380"></canvas>
<p style="font-size:12.5px;color:var(--dim);margin:0">The curve shows z vs pressure at your temperature — the classic Standing–Katz “dip”: attraction dominates at moderate pressure (z&lt;1), molecular volume dominates at high pressure (z&gt;1).</p>
</div></div>
`},
{title:"Black-oil properties: Rs, Bo, Bt, co, μo", type:"read", html:`
<h3>Solution gas–oil ratio R<sub>s</sub></h3>
<p><span class="keyterm">R<sub>s</sub></span> = scf of gas dissolved per stb of oil at given p, T. Above p<sub>b</sub> it is constant at R<sub>si</sub> (nothing escapes); below p<sub>b</sub> it falls as gas is liberated. Standing's correlation (California crudes) is the workhorse estimate:</p>
<div class="fx">R<sub>s</sub> = γ<sub>g</sub>[ (p/18.2 + 1.4) · 10<sup>(0.0125·API − 0.00091·T)</sup> ]<sup>1.2048</sup></div>
<h3>Oil formation volume factor B<sub>o</sub></h3>
<p><span class="keyterm">B<sub>o</sub></span> = reservoir bbl per stock-tank bbl (rb/stb). It exceeds 1 because reservoir oil carries dissolved gas and thermal expansion. B<sub>o</sub> rises with pressure up to p<sub>b</sub> (more gas dissolved), peaks at p<sub>b</sub>, then <em>declines slightly above p<sub>b</sub></em> (pure liquid compression):</p>
<div class="fx"><span class="lbl">Standing, saturated oil</span>B<sub>o</sub> = 0.9759 + 0.000120·[ R<sub>s</sub>(γ<sub>g</sub>/γ<sub>o</sub>)<sup>0.5</sup> + 1.25T ]<sup>1.2</sup><br><span class="lbl" style="margin-top:8px">Above bubble point</span>B<sub>o</sub> = B<sub>ob</sub> · e<sup>−c<sub>o</sub>(p−p<sub>b</sub>)</sup></div>
<h3>Total (two-phase) FVF and oil compressibility</h3>
<div class="fx">B<sub>t</sub> = B<sub>o</sub> + B<sub>g</sub>(R<sub>si</sub> − R<sub>s</sub>)</div>
<p>B<sub>t</sub> tracks the volume occupied by 1 stb of oil <em>plus all its original gas</em> — the natural variable of material balance. Undersaturated oil compressibility (Vasquez–Beggs):</p>
<div class="fx">c<sub>o</sub> = <span class="frac"><span>−1433 + 5R<sub>s</sub> + 17.2T − 1180γ<sub>g</sub> + 12.61·API</span><span>10<sup>5</sup> · p</span></span></div>
<h3>Oil viscosity μ<sub>o</sub></h3>
<p>Dead-oil viscosity (no gas) from Beggs–Robinson, then reduced for dissolved gas below p<sub>b</sub> (live oil), then increased for compression above p<sub>b</sub>. The pattern to internalise: <b>μ<sub>o</sub> falls as pressure rises to p<sub>b</sub></b> (gas thins the oil), then rises slowly above p<sub>b</sub>. Every property — R<sub>s</sub>, B<sub>o</sub>, μ<sub>o</sub>, c<sub>o</sub> — has its characteristic kink at the bubble point; a PVT plot without that kink is a plot you should question.</p>
<div class="example"><div class="xh">Worked example — density of reservoir oil</div><div class="xb">
<p>A 35° API oil (γ<sub>o</sub> = 141.5/(131.5+35) = 0.850) has R<sub>s</sub> = 600 scf/stb (γ<sub>g</sub>=0.75) and B<sub>o</sub>=1.32 rb/stb. Find reservoir oil density.</p>
<details class="step"><summary>Solution — mass balance per stb</summary><div class="sb">ρ<sub>o</sub> = (350γ<sub>o</sub> + 0.0764γ<sub>g</sub>R<sub>s</sub>) / (5.615·B<sub>o</sub>) = (350×0.850 + 0.0764×0.75×600)/(5.615×1.32) = (297.5+34.4)/7.412 = <b>44.8 lb/ft³</b> → gradient 44.8/144 = 0.311 psi/ft. This is where the oil gradients of Module 2 come from.</div></details>
</div></div>
`},
{title:"Checkpoint · Module 4", type:"quiz", quiz:[
{q:"A reservoir at T between the critical temperature and the cricondentherm contains…",opts:["Black oil","Volatile oil","Retrograde gas-condensate","Dry gas"],a:2,why:"That temperature window is the retrograde region: isothermal depletion crosses the dew-point curve and liquid condenses in the reservoir."},
{q:"Bg = 0.02827·zT/p. If z=0.85, T=640°R, p=3,200 psia, Bg ≈…",opts:["0.0048 ft³/scf","0.048 ft³/scf","0.48 ft³/scf","4.8 ft³/scf"],a:0,why:"0.02827×0.85×640/3200 = 0.00481 ft³/scf — reservoir gas is ~200× denser than surface gas."},
{q:"Above the bubble point, Rs…",opts:["Rises with pressure","Falls with pressure","Stays constant at Rsi","Equals zero"],a:2,why:"No gas can escape solution above pb, so Rs is fixed at its initial value."},
{q:"Oil viscosity, moving from low pressure up to pb, generally…",opts:["Rises (compression)","Falls (more dissolved gas thins the oil)","Is constant","Equals gas viscosity at pb"],a:1,why:"Dissolved gas lightens and thins the oil; μo reaches its minimum at pb, then rises slowly with further compression."},
{q:"Bt = Bo + Bg(Rsi − Rs) represents…",opts:["Gas cap volume","The reservoir volume of 1 stb oil plus its liberated gas","Water FVF","Shrinkage only"],a:1,why:"The two-phase FVF tracks oil and all gas originally dissolved in it — the bookkeeping unit of material balance."},
{q:"The Standing–Katz z-chart dips below 1.0 at moderate pressures because…",opts:["Molecular volume dominates","Intermolecular attraction compresses the gas more than ideal","Temperature is too low to matter","The chart is empirical noise"],a:1,why:"Attraction pulls molecules together (z<1); at high pressure finite molecular volume pushes z above 1."}
]}
]});

COURSE.push({
id:"m5", num:"05", title:"PVT Laboratory Analysis", depth:"1,600 – 1,900 m",
tag:"Fluid physics",
blurb:"How the numbers of Module 4 are actually measured: sampling, constant composition expansion, differential liberation, and separator tests.",
lessons:[
{title:"Sampling and the three classic experiments", type:"read", html:`
<h3>Getting a representative sample</h3>
<p>Everything downstream depends on capturing fluid that represents the original reservoir. <b>Bottom-hole (subsurface) sampling</b> catches single-phase fluid at depth — best while p<sub>wf</sub> &gt; p<sub>b</sub>. <b>Surface recombination sampling</b> collects separator gas and liquid and recombines them at the measured producing GOR — cheaper, but only valid if the well was flowing stably with GOR = R<sub>si</sub>. Sample early, before pressure falls below the bubble point anywhere near the well.</p>
<h3>1 · Constant Composition Expansion (CCE / flash expansion)</h3>
<p>The sealed cell's volume is expanded in steps at reservoir temperature; <em>nothing is removed</em>. Plot total volume vs pressure: the sharp break in slope marks <span class="keyterm">p<sub>b</sub></span>. Above p<sub>b</sub>, CCE yields oil compressibility and relative volume V/V<sub>b</sub>; below p<sub>b</sub>, total two-phase volume.</p>
<h3>2 · Differential Liberation (DL)</h3>
<p>Below p<sub>b</sub>, at each pressure step the liberated gas is <em>removed</em> from the cell before the next step. This mimics the reservoir, where mobile gas flows away from the oil. DL reports, at each pressure: <b>R<sub>sd</sub></b>, <b>B<sub>od</sub></b>, liberated-gas z and gravity, and oil density — the depletion path of the <em>reservoir</em>.</p>
<h3>3 · Separator tests</h3>
<p>Reservoir oil is flashed through one or more separator stages to stock tank, reporting <b>B<sub>ofb</sub></b> and <b>R<sub>sfb</sub></b> for each separator pressure. This mimics what happens in the <em>tubing and facilities</em>. Running several separator pressures finds the optimum (maximum stock-tank recovery, minimum B<sub>o</sub>).</p>
<div class="callout"><div class="ct">Why two liberation styles?</div><p>Gas leaving oil in the reservoir does so gradually and escapes (differential); gas leaving in the separator does so in one violent step with everything kept in contact (flash). Real oil experiences <em>both</em> — so lab data must be combined, which is the next lesson.</p></div>
`},
{title:"Converting lab data to field black-oil properties", type:"read", html:`
<h3>The composite correction</h3>
<p>Field B<sub>o</sub> and R<sub>s</sub> must describe: differential depletion in the reservoir <em>followed by</em> flash through the actual separators. The standard adjustment scales the DL curves by the separator-test anchors:</p>
<div class="fx"><span class="lbl">Corrected FVF (saturated region)</span>B<sub>o</sub> = B<sub>od</sub> · <span class="frac"><span>B<sub>ofb</sub></span><span>B<sub>odb</sub></span></span></div>
<div class="fx"><span class="lbl">Corrected solution GOR</span>R<sub>s</sub> = R<sub>sfb</sub> − (R<sub>sdb</sub> − R<sub>sd</sub>) · <span class="frac"><span>B<sub>ofb</sub></span><span>B<sub>odb</sub></span></span></div>
<div class="vars"><b>subscript d</b> = differential at pressure p · <b>db</b> = differential at bubble point · <b>fb</b> = flash (separator test) from bubble point.</div>
<div class="example"><div class="xh">Worked example — building the field Bo</div><div class="xb">
<p>DL at p<sub>b</sub>: B<sub>odb</sub>=1.485, R<sub>sdb</sub>=720. Separator test: B<sub>ofb</sub>=1.392, R<sub>sfb</sub>=646. At p=1,800 psia the DL reports B<sub>od</sub>=1.376, R<sub>sd</sub>=520. Find field values at 1,800 psia.</p>
<details class="step"><summary>Step 1 — scale factor</summary><div class="sb">B<sub>ofb</sub>/B<sub>odb</sub> = 1.392/1.485 = 0.9374.</div></details>
<details class="step"><summary>Step 2 — corrected values</summary><div class="sb">B<sub>o</sub> = 1.376×0.9374 = <b>1.290 rb/stb</b>. R<sub>s</sub> = 646 − (720−520)×0.9374 = 646 − 187.5 = <b>458 scf/stb</b>.</div></details>
<details class="step"><summary>Why it matters</summary><div class="sb">Using raw DL values in material balance overstates B<sub>o</sub> and R<sub>s</sub> — a classic source of OOIP error of several percent.</div></details>
</div></div>
<h3>Quality-control instincts</h3>
<ul>
<li>Check p<sub>b</sub> consistency between CCE and DL (should agree within a few psi).</li>
<li>All property curves must kink at the same p<sub>b</sub>.</li>
<li>Recombination GOR should match the stabilised field GOR at sampling time.</li>
<li>For gas condensates, the analogous experiment is the <b>constant volume depletion (CVD)</b> test, yielding liquid-dropout curves and produced-gas compositions.</li>
</ul>
`},
{title:"Checkpoint · Module 5", type:"quiz", quiz:[
{q:"In a CCE test, the bubble point appears as…",opts:["A colour change","A sharp break in the pressure–volume slope","Gas venting from the cell","A temperature spike"],a:1,why:"Liquid is stiff, two-phase mixtures are compressible: the p–V slope breaks abruptly at pb."},
{q:"Differential liberation differs from flash liberation because…",opts:["It is done at surface temperature","Liberated gas is removed at each step","Composition stays constant","Oil is removed at each step"],a:1,why:"Removing gas at each step changes the remaining composition — mimicking gas escaping in the reservoir."},
{q:"Separator tests are run at several pressures to…",opts:["Measure permeability","Find the separator pressure giving maximum stock-tank oil (minimum Bo)","Calibrate the pressure gauges","Measure water salinity"],a:1,why:"An optimum separator pressure maximises liquid recovery; too high or too low flashes valuable intermediates to gas."},
{q:"Field Bo below pb is obtained from lab data as…",opts:["Bod alone","Bofb alone","Bod × (Bofb/Bodb)","Bod + Bofb"],a:2,why:"DL shape scaled to the separator-test anchor combines reservoir-style liberation with the real surface flash."},
{q:"Surface recombination sampling is invalid when…",opts:["GOR at sampling ≠ Rsi (well already below pb)","Separator pressure is known","The oil is undersaturated","Two separators are used"],a:0,why:"If free gas already flows, the measured GOR no longer represents the original dissolved gas, and the recombined fluid is wrong."}
]}
]});

COURSE.push({
id:"m6", num:"06", title:"Volumetric Reserves Estimation", depth:"1,900 – 2,200 m",
tag:"Volumes",
blurb:"From contour maps to barrels: bulk-volume integration, OOIP & OGIP formulas, recovery factors, and probabilistic (Monte Carlo) estimates.",
lessons:[
{title:"From maps to bulk volume", type:"read", html:`
<h3>The volumetric chain</h3>
<p>Volumetrics is the geologist–engineer handshake: seismic + well picks → structure and isopach maps → bulk rock volume → pore volume → hydrocarbon pore volume → surface volumes.</p>
<p>Given areas A<sub>0</sub>, A<sub>1</sub>, … A<sub>n</sub> enclosed by successive isopach contours (spacing h), integrate:</p>
<div class="fx"><span class="lbl">Trapezoidal rule (adjacent ratio &gt; 0.5)</span>ΔV = <span class="frac"><span>h</span><span>2</span></span>(A<sub>n</sub> + A<sub>n+1</sub>)</div>
<div class="fx"><span class="lbl">Pyramidal rule (adjacent ratio ≤ 0.5, near the crest)</span>ΔV = <span class="frac"><span>h</span><span>3</span></span>(A<sub>n</sub> + A<sub>n+1</sub> + √(A<sub>n</sub>A<sub>n+1</sub>))</div>
<div class="fx"><span class="lbl">Simpson's rule (odd number of equally spaced contours)</span>V = <span class="frac"><span>h</span><span>3</span></span>(A<sub>0</sub> + 4A<sub>1</sub> + 2A<sub>2</sub> + 4A<sub>3</sub> + … + A<sub>n</sub>) + <span class="frac"><span>t̄<sub>top</sub>A<sub>n</sub></span><span>1</span></span></div>
<p>The trapezoidal rule slightly overestimates near a rounded crest — hence the switch to the pyramidal formula when successive areas shrink quickly.</p>
<h3>Net-to-gross</h3>
<p>Only reservoir-quality rock counts. Apply the <span class="keyterm">net-to-gross ratio (NTG)</span> from log cutoffs (V<sub>shale</sub>, φ, S<sub>w</sub>) to convert gross to net rock volume.</p>
`},
{title:"OOIP, OGIP, recovery factor — and uncertainty", type:"read", html:`
<h3>The master formulas</h3>
<div class="fx"><span class="lbl">Original oil in place (stb)</span>N = <span class="frac"><span>7758 · A · h · φ · (1 − S<sub>wi</sub>)</span><span>B<sub>oi</sub></span></span></div>
<div class="vars"><b>7758</b> = bbl per acre-ft · <b>A</b> acres · <b>h</b> net pay ft · <b>φ</b> fraction · <b>S<sub>wi</sub></b> fraction · <b>B<sub>oi</sub></b> rb/stb.</div>
<div class="fx"><span class="lbl">Original gas in place (scf)</span>G = <span class="frac"><span>43560 · A · h · φ · (1 − S<sub>wi</sub>)</span><span>B<sub>gi</sub></span></span> &nbsp;&nbsp;(B<sub>gi</sub> in ft³/scf)</div>
<p><span class="keyterm">Reserves</span> = in-place volume × <span class="keyterm">recovery factor</span> (RF). RF comes from drive mechanism analogues, material balance, displacement calculations, or simulation. For volumetric (depletion) gas reservoirs, RF is elegantly analytic:</p>
<div class="fx">RF<sub>gas</sub> = 1 − <span class="frac"><span>B<sub>gi</sub></span><span>B<sub>ga</sub></span></span> = 1 − <span class="frac"><span>(p/z)<sub>abandon</sub></span><span>(p/z)<sub>initial</sub></span></span> &nbsp;&nbsp;(often 70–90%)</div>
<h3>Deterministic vs probabilistic</h3>
<p>Every input (A, h, φ, S<sub>w</sub>, B<sub>o</sub>, NTG, RF) is uncertain. Modern practice samples each from a distribution and runs thousands of trials — <span class="keyterm">Monte Carlo simulation</span> — reporting <b>P90</b> (90% probability of at least this much — proved-like), <b>P50</b> (best estimate) and <b>P10</b> (upside). Because the inputs multiply, the result is roughly log-normal and the mean exceeds P50.</p>
<div class="lab" data-widget="ooip"><div class="lh"><span class="dot"></span><b>Lab · OOIP Calculator + Monte Carlo</b></div>
<div class="body"><div class="ctrl">
<label>Area A (acres) ±20%<input type="number" value="1200" data-in="a"></label>
<label>Net pay h (ft) ±15%<input type="number" value="45" data-in="h"></label>
<label>Porosity φ ±10%<input type="number" value="0.22" step="0.01" data-in="phi"></label>
<label>S<sub>wi</sub> ±10%<input type="number" value="0.25" step="0.01" data-in="sw"></label>
<label>B<sub>oi</sub> (rb/stb) ±5%<input type="number" value="1.30" step="0.01" data-in="boi"></label>
<label>Recovery factor ±25%<input type="number" value="0.32" step="0.01" data-in="rf"></label>
</div>
<div class="readout">
<div class="chip"><span>Deterministic OOIP</span><b data-out="n"></b></div>
<div class="chip"><span>P90 reserves</span><b data-out="p90"></b></div>
<div class="chip"><span>P50 reserves</span><b data-out="p50"></b></div>
<div class="chip"><span>P10 reserves</span><b data-out="p10"></b></div>
</div>
<canvas width="720" height="330"></canvas>
<p style="font-size:12.5px;color:var(--dim);margin:0">5,000 Monte Carlo trials, each input drawn from a triangular distribution around your value (± the stated spread). Note the right-skewed histogram — products of uncertain numbers are log-normal-ish, and the P10/P90 ratio is a standard maturity metric of an asset.</p>
</div></div>
<div class="example"><div class="xh">Worked example — quick-look OOIP</div><div class="xb">
<p>A=1,200 ac, h=45 ft, φ=0.22, S<sub>wi</sub>=0.25, B<sub>oi</sub>=1.30.</p>
<details class="step"><summary>Solution</summary><div class="sb">N = 7758×1200×45×0.22×0.75/1.30 = <b>≈ 53.2 MMstb</b>. At RF=32%, reserves ≈ 17.0 MMstb.</div></details>
</div></div>
`},
{title:"Checkpoint · Module 6", type:"quiz", quiz:[
{q:"The constant 7758 in the OOIP formula converts…",opts:["psi to psia","acre-feet to barrels","scf to stb","md to darcy"],a:1,why:"One acre-foot contains 7,758 barrels; 43,560 is its ft³ equivalent used for gas."},
{q:"Two successive isopach contour areas are 900 and 380 acres. Which incremental-volume rule applies?",opts:["Trapezoidal (ratio > 0.5)","Pyramidal (ratio ≤ 0.5)","Simpson only","Neither"],a:1,why:"380/900 = 0.42 ≤ 0.5 → the crest is closing fast; use the pyramidal frustum formula."},
{q:"For a volumetric dry-gas reservoir with (p/z)i = 5,000 and (p/z)ab = 900 psia, RF ≈…",opts:["18%","55%","82%","95%"],a:2,why:"RF = 1 − 900/5000 = 0.82 — the beauty of depletion gas reservoirs."},
{q:"P90 reserves means…",opts:["The 90th percentile upside","A value with 90% probability that actual reserves equal or exceed it","OOIP × 0.90","Reserves after 90% water cut"],a:1,why:"P90 is the conservative, proved-like tail: 90% chance of at least this volume."},
{q:"Doubling porosity in the volumetric formula, all else fixed, changes N by…",opts:["√2","×2","×4","No change"],a:1,why:"N is linear in each multiplicative input — which is also why fractional errors in each input add up in the total."}
]}
]});
</script>

COURSE.push({
id:"m7", num:"07", title:"Material Balance — Oil Reservoirs", depth:"2,200 – 2,500 m",
tag:"Volumes",
blurb:"The general material balance equation from first principles, drive indices, and the Havlena–Odeh straight-line method.",
lessons:[
{title:"Deriving the general material balance equation", type:"read", html:`
<h3>The zero-dimensional tank</h3>
<p>Treat the reservoir as one tank at uniform (average) pressure. The logic is pure conservation: <em>the reservoir volume vacated by produced fluids must be filled by the expansion of what remains plus anything that entered.</em> Balance everything in reservoir barrels at pressure p:</p>
<div class="fx"><span class="lbl">Underground withdrawal = expansion + influx</span>N<sub>p</sub>[B<sub>o</sub> + (R<sub>p</sub> − R<sub>s</sub>)B<sub>g</sub>] + W<sub>p</sub>B<sub>w</sub> = N·E<sub>o</sub> + N·m·E<sub>g</sub> + N(1+m)E<sub>f,w</sub> + W<sub>e</sub> + (W<sub>inj</sub>B<sub>w</sub> + G<sub>inj</sub>B<sub>g,inj</sub>)</div>
<p>with the three expansion terms:</p>
<div class="fx">E<sub>o</sub> = (B<sub>o</sub> − B<sub>oi</sub>) + (R<sub>si</sub> − R<sub>s</sub>)B<sub>g</sub> &nbsp;&nbsp;<span style="color:var(--dim)">— oil + liberated solution gas</span><br>
E<sub>g</sub> = B<sub>oi</sub>[ B<sub>g</sub>/B<sub>gi</sub> − 1 ] &nbsp;&nbsp;<span style="color:var(--dim)">— gas-cap expansion</span><br>
E<sub>f,w</sub> = B<sub>oi</sub> <span class="frac"><span>c<sub>w</sub>S<sub>wc</sub> + c<sub>f</sub></span><span>1 − S<sub>wc</sub></span></span> Δp &nbsp;&nbsp;<span style="color:var(--dim)">— connate water + pore compaction</span></div>
<div class="vars"><b>N</b> OOIP, stb · <b>N<sub>p</sub></b> cumulative oil, stb · <b>R<sub>p</sub></b> = G<sub>p</sub>/N<sub>p</sub> cumulative produced GOR · <b>m</b> = (gas-cap HC pore volume)/(oil-zone HC pore volume) · <b>W<sub>e</sub></b> water influx, rb · <b>Δp</b> = p<sub>i</sub> − p.</div>
<p>Special cases fall out instantly:</p>
<ul>
<li><b>Undersaturated, no aquifer</b> (R<sub>s</sub>=R<sub>si</sub>, m=0, W<sub>e</sub>=0): N<sub>p</sub>B<sub>o</sub> = N B<sub>oi</sub> c<sub>e</sub> Δp with the effective compressibility c<sub>e</sub> = (c<sub>o</sub>S<sub>o</sub>+c<sub>w</sub>S<sub>wc</sub>+c<sub>f</sub>)/(1−S<sub>wc</sub>). Note c<sub>f</sub> and c<sub>w</sub> are <em>not</em> negligible here — they can be half the energy.</li>
<li><b>Solution-gas drive below p<sub>b</sub></b>: drop m and W<sub>e</sub>; the equation ties N<sub>p</sub> and G<sub>p</sub> to fluid expansion alone.</li>
</ul>
<div class="callout"><div class="ct">What MB can and cannot see</div><p>Material balance is zero-dimensional: it knows nothing of well placement, permeability or geometry. That is its weakness and its power — it estimates N and diagnoses drive using only pressures, production and PVT, completely independent of the geological map. When MB-N and volumetric-N disagree, something important is wrong with one of them (connected volume ≠ mapped volume is the usual suspect).</p></div>
`},
{title:"Drive indices & the Havlena–Odeh straight line", type:"read", html:`
<h3>Drive indices — the energy audit</h3>
<p>Divide the MBE through by the total withdrawal and each energy source's share appears directly:</p>
<div class="fx">DDI + SDI + WDI + CDI = 1<br>
DDI = <span class="frac"><span>N·E<sub>o</sub></span><span>A</span></span>, &nbsp;SDI = <span class="frac"><span>N·m·E<sub>g</sub></span><span>A</span></span>, &nbsp;WDI = <span class="frac"><span>W<sub>e</sub> − W<sub>p</sub>B<sub>w</sub></span><span>A</span></span>, &nbsp;CDI = <span class="frac"><span>N(1+m)E<sub>f,w</sub></span><span>A</span></span></div>
<div class="vars">A = N<sub>p</sub>[B<sub>o</sub> + (R<sub>p</sub>−R<sub>s</sub>)B<sub>g</sub>] — the underground withdrawal. DDI = depletion, SDI = (gas-cap) segregation, WDI = water, CDI = compaction/connate-water drive.</div>
<p>Track the indices with time: a rising WDI announces a stronger-than-mapped aquifer; a collapsing DDI warns that pressure support must come from somewhere else — soon.</p>
<h3>Havlena–Odeh: making MB a straight line</h3>
<p>Write F = N<sub>p</sub>[B<sub>o</sub>+(R<sub>p</sub>−R<sub>s</sub>)B<sub>g</sub>] + W<sub>p</sub>B<sub>w</sub> (withdrawal) and E<sub>t</sub> = E<sub>o</sub> + mE<sub>g</sub> + (1+m)E<sub>f,w</sub>. Then:</p>
<div class="fx">F = N·E<sub>t</sub> + W<sub>e</sub></div>
<ul>
<li><b>No aquifer:</b> plot F vs E<sub>t</sub> → straight line through the origin, slope = N. Curvature upward ⇒ hidden energy (aquifer or larger m); downward ⇒ over-estimated energy.</li>
<li><b>Unknown m:</b> plot F/E<sub>o</sub> vs E<sub>g</sub>/E<sub>o</sub> → intercept N, slope Nm.</li>
<li><b>With aquifer:</b> plot F/E<sub>t</sub> vs W<sub>e</sub>/E<sub>t</sub> (W<sub>e</sub> from an aquifer model, Module 9) → a correct model gives a straight line of slope 1 and intercept N. A curved plot means the aquifer model, not the reservoir, is wrong — iterate.</li>
</ul>
<div class="example"><div class="xh">Worked example — undersaturated depletion</div><div class="xb">
<p>N unknown. p<sub>i</sub>=4,000 psia, current p=3,500 psia (above p<sub>b</sub>). N<sub>p</sub>=1.86 MMstb, B<sub>o</sub>=1.312, B<sub>oi</sub>=1.300, c<sub>w</sub>=3×10⁻⁶, c<sub>f</sub>=4×10⁻⁶ psi⁻¹, S<sub>wc</sub>=0.22, W<sub>e</sub>=W<sub>p</sub>=0.</p>
<details class="step"><summary>Step 1 — expansion terms</summary><div class="sb">E<sub>o</sub> = B<sub>o</sub>−B<sub>oi</sub> = 0.012 rb/stb (no free gas above pb). E<sub>f,w</sub> = 1.300×[(3e-6×0.22+4e-6)/0.78]×500 = 1.300×5.97e-6×500 = 0.00388 rb/stb.</div></details>
<details class="step"><summary>Step 2 — solve for N</summary><div class="sb">F = N<sub>p</sub>B<sub>o</sub> = 1.86e6×1.312 = 2.440 MMrb. N = F/(E<sub>o</sub>+E<sub>f,w</sub>) = 2.440e6/0.01588 = <b>≈ 154 MMstb</b>.</div></details>
<details class="step"><summary>Step 3 — the lesson</summary><div class="sb">Ignoring rock and water compressibility (using E<sub>o</sub> alone) would give N = 203 MMstb — a 32% overestimate. Above the bubble point, E<sub>f,w</sub> is never optional.</div></details>
</div></div>
`},

{title:"The p/z method", type:"read", html:`
<h3>Depletion gas MBE in three lines</h3>
<p>For a volumetric (no-water-drive) gas reservoir, gas remaining = G − G<sub>p</sub>, occupying constant reservoir volume:</p>
<div class="fx">G·B<sub>gi</sub> = (G − G<sub>p</sub>)·B<sub>g</sub> &nbsp;&nbsp;with&nbsp; B<sub>g</sub> ∝ z/p &nbsp;⇒</div>
<div class="fx"><span class="lbl">The p/z equation</span><span class="frac"><span>p</span><span>z</span></span> = <span class="frac"><span>p<sub>i</sub></span><span>z<sub>i</sub></span></span>( 1 − <span class="frac"><span>G<sub>p</sub></span><span>G</span></span> )</div>
<p><b>p/z vs G<sub>p</sub> is a straight line.</b> Its x-intercept is G (OGIP); dropping a horizontal at the abandonment p/z reads recoverable reserves directly. This is why gas engineers guard the p/z plot like a treasure: two or three good shut-in pressure surveys and the whole future of the field is on one page.</p>
<div class="lab" data-widget="pz"><div class="lh"><span class="dot"></span><b>Lab · p/z Extrapolator</b></div>
<div class="body"><p style="font-size:13.5px;color:var(--dim);margin:0">Edit the survey data (cumulative production vs measured p/z). The lab fits a least-squares line, extrapolates OGIP, and computes reserves to your abandonment p/z.</p>
<div class="ctrl" data-rows></div>
<div class="ctrl"><label>Abandonment p/z (psia)<input type="number" value="800" step="50" data-in="pzab"></label></div>
<canvas width="720" height="380"></canvas>
<div class="readout">
<div class="chip"><span>OGIP G (x-intercept)</span><b data-out="g"></b></div>
<div class="chip"><span>Reserves to abandonment</span><b data-out="res"></b></div>
<div class="chip"><span>Recovery factor</span><b data-out="rf"></b></div>
</div>
</div></div>
<div class="callout oil"><div class="ct">Why z matters</div><p>Plot raw p instead of p/z and the “line” bends — early points extrapolate to the wrong G by 10–30%. The z-factor straightens real-gas behaviour into a ruler. Never extrapolate a two-point p/z line drawn too early in field life; give the trend at least ~10–20% depletion before trusting it.</p></div>
`},
{title:"Water-drive and abnormally pressured gas reservoirs", type:"read", html:`
<h3>When the line lies</h3>
<p><b>Water drive:</b> influx W<sub>e</sub> shrinks the gas volume, propping pressure up. The MBE becomes:</p>
<div class="fx"><span class="frac"><span>p</span><span>z</span></span> = <span class="frac"><span>p<sub>i</sub></span><span>z<sub>i</sub></span></span> · <span class="frac"><span>1 − G<sub>p</sub>/G</span><span>1 − W<sub>e</sub>/(G·B<sub>gi</sub>) + W<sub>p</sub>B<sub>w</sub>/(G·B<sub>gi</sub>)</span></span></div>
<p>The p/z plot flattens or curves <em>concave-up</em>; naive extrapolation <b>overestimates G</b>. Worse, water invasion traps gas behind the front at high pressure (residual gas saturation ≈ 30–40% of pore volume), so water-drive gas reservoirs often recover <em>less</em> (50–70%) than depletion ones (80–90%) — a famous inversion of intuition. Diagnostics: the Cole plot, F/E<sub>t</sub> vs G<sub>p</sub> — flat for depletion, rising for water drive.</p>
<h3>Abnormally pressured (geopressured) reservoirs</h3>
<p>In strongly overpressured reservoirs, pore compaction and water expansion contribute meaningful early energy. The p/z plot shows <b>two slopes</b>: a shallow early slope (rock+water energy helping) breaking to a steeper late slope (gas expansion alone). Extrapolating the early slope can overestimate G by 30–100%. Roach/Ramagost–Farshad corrected plots — p/z·[1 − (c<sub>f</sub>+c<sub>w</sub>S<sub>w</sub>)Δp/(1−S<sub>w</sub>)] vs G<sub>p</sub> — restore linearity.</p>
<div class="example"><div class="xh">Worked example — reading a p/z line</div><div class="xb">
<p>Surveys: (G<sub>p</sub>=0, p/z=4,600), (G<sub>p</sub>=120 Bscf, p/z=3,930), (G<sub>p</sub>=250 Bscf, p/z=3,180). Abandonment p/z = 750 psia.</p>
<details class="step"><summary>Step 1 — slope and intercept</summary><div class="sb">Slope ≈ (3,180−4,600)/250 = −5.68 psia/Bscf. Intercept 4,600. x-intercept G = 4,600/5.68 = <b>≈ 810 Bscf</b>.</div></details>
<details class="step"><summary>Step 2 — reserves</summary><div class="sb">G<sub>p,ab</sub> = G(1 − 750/4,600) = 810×0.837 = <b>≈ 678 Bscf</b>; RF ≈ 84%.</div></details>
</div></div>
`},
{title:"Checkpoint · Module 8", type:"quiz", quiz:[
{q:"On a p/z vs Gp plot for a volumetric gas reservoir, OGIP is…",opts:["The slope","The y-intercept","The x-intercept","The area under the line"],a:2,why:"At p/z = 0 all gas would be produced: the x-intercept is G."},
{q:"A water-drive gas reservoir's p/z plot typically…",opts:["Steeper than depletion","Flattens, overestimating G if extrapolated","Passes through the origin","Is unaffected"],a:1,why:"Pressure support props up p/z; the naive straight-line extrapolation lands beyond the true G."},
{q:"Water-drive gas reservoirs often recover LESS than depletion-drive ones because…",opts:["Water corrodes tubing","Gas is trapped at high pressure behind the advancing water","z-factors are lower","Wells water out instantly"],a:1,why:"Residual gas trapped at high pressure contains many more moles than gas abandoned at low depletion pressure."},
{q:"An abnormally pressured gas reservoir shows a p/z plot with…",opts:["One perfect line","Two slopes — shallow early, steeper late","Negative slope reversal","Scatter only"],a:1,why:"Early rock/water compressibility energy flattens the initial trend; once spent, pure gas expansion steepens it."},

]}
